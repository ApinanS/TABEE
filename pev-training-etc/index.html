<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETC PEV Training Studio · Sydney Accord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: the trainee's road to registration is a four-stop line across the top; every screen hangs off one stop. Colour comes from TABEE's own episode covers: crimson with an orange spark. */
:root{
  --paper:#F2F5F4; --sheet:#ffffff; --ink:#1f1315; --soft:#6f5d60; --rule:#e6dcd8;
  --brand:#0B5D6B; --brand-2:#083F49; --spark:#e8621a; --on:#ffffff; --tint:#E2F0F1;
  --ok:#1f7a4a; --ok-t:#e2f2e8; --warn:#9a5b00; --warn-t:#fbeed2; --bad:#b3261e; --bad-t:#fbe4e1;
  --f-d:"Prompt","Anuphan",system-ui,sans-serif; --f-b:"Anuphan","Leelawadee UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#170e10;--sheet:#22161a;--ink:#f4ecec;--soft:#b9a6a9;--rule:#3a272c;--brand:#23919B;--brand-2:#0B5D6B;--spark:#ff8a45;--on:#ffffff;--tint:#12363C;--ok:#6fcf97;--ok-t:#16301f;--warn:#e8b455;--warn-t:#3a2b0f;--bad:#f08379;--bad-t:#3d1a17;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#170e10;--sheet:#22161a;--ink:#f4ecec;--soft:#b9a6a9;--rule:#3a272c;--brand:#23919B;--brand-2:#0B5D6B;--spark:#ff8a45;--on:#ffffff;--tint:#12363C;--ok:#6fcf97;--ok-t:#16301f;--warn:#e8b455;--warn-t:#3a2b0f;--bad:#f08379;--bad-t:#3d1a17;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.65}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.25;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--brand-2);color:var(--on)}
.bar .in{max-width:1180px;margin:0 auto;padding:10px clamp(16px,4vw,36px);display:flex;gap:10px 22px;align-items:center;flex-wrap:wrap}
.logo{font:800 17px var(--f-d);letter-spacing:.02em;color:var(--on);text-decoration:none}
.logo span{font-weight:500;opacity:.8}
.stops{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.stops a{color:var(--on);text-decoration:none;font:500 14px var(--f-d);padding:6px 12px;border-radius:999px;white-space:nowrap;opacity:.8;display:flex;gap:7px;align-items:center}
.stops a b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);font-size:12px}
.stops a[aria-current="page"]{background:var(--on);color:var(--brand-2);opacity:1}
.stops a[aria-current="page"] b{background:var(--spark);color:var(--on)}
.hub{color:var(--on);font-size:13px;opacity:.85}
.page{max-width:1180px;margin:0 auto;padding:28px clamp(16px,4vw,36px) 80px;display:flex;flex-direction:column;gap:26px}
.lead{color:var(--soft);max-width:66ch;margin:8px 0 0}
h1{font-size:clamp(28px,4vw,42px);font-weight:800}
h2{font-size:21px;font-weight:700}
.crumb{font-size:14px;color:var(--soft)}
.crumb a{color:var(--soft)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:16px}
.pad{padding:18px 20px}
.chip{display:inline-block;font:500 12.5px/1.5 var(--f-b);padding:1px 10px;border-radius:999px;white-space:nowrap;background:var(--tint);color:var(--brand)}
.chip.ok{background:var(--ok-t);color:var(--ok)}.chip.warn{background:var(--warn-t);color:var(--warn)}.chip.bad{background:var(--bad-t);color:var(--bad)}.chip.mute{background:var(--rule);color:var(--soft)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font:600 15px var(--f-d);padding:9px 18px;border-radius:999px;background:var(--brand);color:var(--on);display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--brand-2)} .btn:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.btn.ghost:hover{background:var(--tint)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.note{font-size:13.5px;color:var(--soft)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 40px;align-items:center}
.hero img{border-radius:18px;box-shadow:0 18px 40px -22px rgba(0,40,46,.6)}
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stop{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;border-radius:18px;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);overflow:hidden;transition:transform .16s ease,border-color .16s}
.stop:hover{transform:translateY(-3px);border-color:var(--brand)}
.stop .no{font:800 64px/1 var(--f-d);color:var(--tint);position:absolute;right:10px;top:4px}
.stop.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.stop.on .no{color:rgba(255,255,255,.18)} .stop.on .note{color:rgba(255,255,255,.85)}
.stop h3{font-size:19px;position:relative}
.stop .big{font:700 26px var(--f-d);font-variant-numeric:tabular-nums;margin-top:8px}
.meter{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--spark);border-radius:3px}
.stop.on .meter{background:rgba(255,255,255,.25)}
/* episodes */
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ep{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:16px;overflow:hidden;transition:transform .16s ease}
.ep:hover{transform:translateY(-3px)}
.ep .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.ep h3{font-size:16px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:20px;align-items:start}
ul.dots{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.slot{border:1.5px dashed var(--rule);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
/* quiz */
.q{padding:18px 20px;border-top:1px solid var(--rule)}
.q:first-child{border-top:0}
.cq{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:20px;align-items:start}
.cimg .slot{display:none}.cimg.noimg img,.cimg.noimg figcaption{display:none}.cimg.noimg .slot{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;border:2px dashed var(--rule);border-radius:12px;color:var(--soft);font-size:13px}
.cimg{margin:0}.cimg img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--rule);background:var(--paper)}
.cimg figcaption{font-size:12px;opacity:.65;margin-top:5px}
@media (max-width:820px){.cq{grid-template-columns:1fr}.cimg{max-width:520px}}
.q .t{font-weight:500;max-width:74ch}
.q .n{font:700 14px var(--f-d);color:var(--brand);margin-right:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 14px;border:1.5px solid var(--rule);border-radius:12px;display:block}
.opt:hover{border-color:var(--brand)} .opt:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--tint)}
.opt.right{border-color:var(--ok);background:var(--ok-t)} .opt.wrong{border-color:var(--bad);background:var(--bad-t)}
.opt[disabled]{cursor:default}
.sol{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--paper);font-size:14.5px}
.lv{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lv .opt{padding:7px 14px;border-radius:999px;font:600 14px var(--f-d)}
.lv .opt{--c:#888;--t:#f4f4f4;--f:#fff;border-color:var(--c);background:var(--t);display:inline-flex;align-items:center;gap:7px}
.lv .opt::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.lv .opt[data-k="N"]{--c:#2e8b57;--t:#e7f4ec}
.lv .opt[data-k="R"]{--c:#d9a400;--t:#fdf5d6;--f:#3a2c00}
.lv .opt[data-k="C"]{--c:#b8661c;--t:#f8eadb}
.lv .opt[data-k="W"]{--c:#2361b0;--t:#e3edf9}
.lv .opt[data-k="D"]{--c:#c0262d;--t:#fbe5e6}
.lv .opt:hover:not([disabled]){background:var(--c);color:var(--f)}
.lv .opt:hover:not([disabled])::before{background:var(--f)}
.lv .opt[disabled]{opacity:.42}
.lv .opt.right{opacity:1;background:var(--c);color:var(--f);border-color:var(--c);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.lv .opt.right::before{content:"✓";width:auto;height:auto;background:none;font-weight:800}
.lv .opt.wrong{opacity:1;background:var(--t);border-style:dashed;text-decoration:line-through}
.lv .opt.wrong::before{content:"✗";width:auto;height:auto;background:none;color:var(--c);font-weight:800}
.lv .opt.pick{background:var(--c);color:var(--f);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}.lv .opt.pick::before{background:var(--f)}
.lvk{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;font-weight:700;color:#fff}
.lvk.N{background:#2e8b57}.lvk.R{background:#d9a400;color:#3a2c00}.lvk.C{background:#b8661c}.lvk.W{background:#2361b0}.lvk.D{background:#c0262d}
.lvlegend{display:flex;flex-wrap:wrap;gap:8px;font-size:13.5px;margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{all:unset;box-sizing:border-box;cursor:pointer;font:500 14px var(--f-d);padding:6px 14px;border-radius:999px;border:1.5px solid var(--rule)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.psel{font:600 15px var(--f-d);background:var(--paper);color:var(--ink);border:1.5px solid var(--brand);border-radius:999px;padding:7px 14px;max-width:100%}
.tab:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .num{font:800 44px/1 var(--f-d);font-variant-numeric:tabular-nums}
/* ser */
.reader{max-height:70vh;overflow:auto;white-space:pre-wrap;font-size:15px;padding:18px 20px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:13.5px;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.form input,.form select,.form textarea{background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:8px 10px;width:100%}
.form textarea{min-height:70px;resize:vertical}
.find{padding:12px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:4px}
.find:first-child{border-top:0}
.x{all:unset;cursor:pointer;color:var(--soft);font-size:13px;text-decoration:underline}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:13px;color:var(--soft);font-weight:600}
tr:last-child td{border-bottom:0}
td select{background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:4px 6px}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
/* onsite */
.day{font:700 15px var(--f-d);padding:10px 20px;background:var(--tint);color:var(--brand);border-radius:16px 16px 0 0}
.ag{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px 20px;border-top:1px solid var(--rule);align-items:start}
.ag input{width:20px;height:20px;accent-color:var(--brand);margin-top:3px}
.ag .k{font:600 12px var(--f-d);padding:2px 10px;border-radius:6px;white-space:nowrap;color:var(--on)}
.k.m{background:var(--brand)} .k.b{background:var(--spark)} .k.l{background:var(--soft)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.sticky{background:var(--warn-t);color:var(--ink);padding:12px;border-radius:4px 4px 14px 4px;font-size:14.5px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 6px 12px -8px rgba(0,0,0,.4)}
.sticky:nth-child(3n+1){transform:rotate(-1deg)} .sticky:nth-child(3n){transform:rotate(1deg)}
@media (max-width:820px){.ag,.ag.br{grid-template-columns:1fr}.mt{top:0}.hero,.two{grid-template-columns:1fr}.road{grid-template-columns:1fr 1fr}.ag{grid-template-columns:30px 1fr}.ag .k{grid-column:2;justify-self:start}}
@media (max-width:480px){.road{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.stop,.ep{transition:none}}
.lang{display:inline-flex;border:1.5px solid var(--on);border-radius:999px;overflow:hidden;flex:none}
.lang button{all:unset;cursor:pointer;font:600 13px var(--f-d);padding:3px 11px;color:var(--on)}
.lang button[aria-pressed="true"]{background:var(--on);color:var(--brand-2)}
.lang button:focus-visible{outline:3px solid var(--spark);outline-offset:-3px}
.src{font-size:13px;color:var(--warn);background:var(--warn-t);border-radius:10px;padding:8px 12px}
/* modules */
.phase{display:flex;flex-direction:column;gap:12px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mod{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:16px;overflow:hidden;transition:transform .16s ease,border-color .16s}
.mod:hover{transform:translateY(-3px);border-color:var(--brand)}
.mod img{aspect-ratio:16/9;object-fit:cover;width:100%;height:auto}
.mod .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.mod h3{font-size:16px}
.mod .mn{font:700 12.5px var(--f-d);color:var(--brand);letter-spacing:.04em;text-transform:uppercase}
.mod .note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mx{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:14px 16px;background:linear-gradient(135deg,var(--brand-2),var(--brand) 60%,var(--spark));color:var(--on)}
.mx b{font:800 54px/1 var(--f-d)} .mx span{font:600 13px var(--f-d);opacity:.9}
.mxbig{display:flex;flex-direction:column;gap:6px;background:linear-gradient(135deg,var(--tint),var(--sheet))}
.vid{position:relative;display:block;border-radius:16px;overflow:hidden}
.vid img{width:100%;height:auto}
.vid .btn{position:absolute;right:14px;bottom:14px}
.mt{margin-top:4px;position:sticky;top:52px;z-index:3;background:var(--paper);padding:8px 0}
.sec{display:flex;flex-direction:column;gap:10px}
.act h3{font:600 15px var(--f-d);margin:0 0 4px;color:var(--brand)}
.act .aimg{margin:4px 0 0;max-width:760px}.act .aimg figcaption{font-size:12.5px;color:var(--soft);margin-top:4px}.act .aimg img{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--rule);background:var(--paper)}
.act .who{font-size:15px;color:var(--soft)}.act .who b{color:var(--ink);margin-right:6px}
.act .ag{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 22px}
.act .ag .do{background:var(--tint);border-radius:12px;padding:10px 14px}
.act .tip{border-left:3px solid var(--spark);padding-left:10px;margin:0}
.qg{border:1px solid var(--rule);border-radius:12px;padding:10px 14px;background:var(--paper)}
.qg summary{cursor:pointer;font:600 15px var(--f-d);color:var(--brand)}
.dots.tb{margin:0;padding-left:18px}.dots.tb li{margin:2px 0}
.qg h4{font:600 14.5px var(--f-d);margin:12px 0 4px}
.qg h4.ab{color:#1F5AA6;border-top:1px dashed var(--rule);padding-top:10px}.qg h4.ab::before{content:'ABET';display:inline-block;font:700 11px var(--f-b);letter-spacing:.06em;background:#1F5AA6;color:#fff;border-radius:6px;padding:2px 7px;margin-right:8px;vertical-align:1px}.qg ol{margin:0;padding-left:22px}.qg li{margin:3px 0}

.sec p{margin:0;max-width:78ch}
.sec .sn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--brand);color:var(--on);font-size:14px;margin-right:10px;vertical-align:2px}
td.k1{font-weight:600;min-width:150px}
.warnlist li::marker{color:var(--spark)}
.viewer{overflow:hidden}
.stage{background:#111;display:grid;place-items:center}
.stage img{width:100%;height:auto;max-height:72vh;object-fit:contain}
.vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--rule)}
.vbar .btn.ghost[data-sl]{padding:6px 16px;font-size:20px;line-height:1}
.pgno{font:600 14px var(--f-d);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px}
.thumbs button{all:unset;cursor:pointer;flex:none;border-radius:6px;outline:2px solid transparent;opacity:.65}
.thumbs button img{width:120px;height:auto;border-radius:6px}
.thumbs button[aria-current="true"]{outline-color:var(--spark);opacity:1}
.thumbs button:hover{opacity:1}
.thumbs button:focus-visible{outline:3px solid var(--spark)}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 14.5px var(--f-d)}
.pn a{text-decoration:none}
.ag .tm{font:600 13.5px var(--f-d);font-variant-numeric:tabular-nums;color:var(--brand)}
.ag .agb{display:flex;flex-direction:column;gap:4px}
.ag .abet{font-size:12px;color:var(--soft);font-style:italic}
.ag .ho{gap:6px}
.ag.br{grid-template-columns:150px 1fr;padding:8px 20px;background:var(--paper)}
.k{font:600 12px var(--f-d);padding:2px 10px;border-radius:6px;white-space:nowrap;color:var(--on)}
.vfail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#111;color:#fff;text-align:center;padding:20px}.vfail .note{color:#ccc}
.etcb{background:#fff7e6;border-left:4px solid #b45309;padding:8px 12px;border-radius:6px;margin:8px 0}.cimg.noimg{display:none}.cq:has(.cimg.noimg){grid-template-columns:1fr}</style>

body{line-height:1.6}
h1{font-weight:700}h2{font-weight:600}

function drawQ(m){
  const Q=QZ[m], last=new Set((S.qlast&&S.qlast[m])||[]), used=new Set(), set=[];
  const pick=(lv,n)=>{const all=Q.map((q,i)=>i).filter(i=>Q[i].l===lv&&!used.has(i));
    const fresh=shuffle(all.filter(i=>!last.has(i))), old=shuffle(all.filter(i=>last.has(i)));
    const got=fresh.concat(old).slice(0,n); got.forEach(i=>used.add(i)); set.push(...got); return n-got.length};
  let short=0; QMIX.forEach(([lv,n])=>{short+=pick(lv,n)});
  if(short>0){['ยากมาก','ปานกลาง','ง่าย'].forEach(lv=>{if(short>0) short=pick(lv,short)})}
  if(set.length<QN){shuffle(Q.map((q,i)=>i).filter(i=>!used.has(i))).slice(0,QN-set.length).forEach(i=>{used.add(i);set.push(i)})}
  S.qlast=S.qlast||{}; S.qlast[m]=set; save();
  return set;
}

function flowPick(code){

  const up=new Set(),dn=new Set();const U=x=>(C[x]?C[x].pre.concat(C[x].co):[]).forEach(y=>{if(!up.has(y)){up.add(y);U(y)}});
  const D=x=>P.courses.filter(c=>c.pre.includes(x)||c.co.includes(x)).forEach(c=>{if(!dn.has(c.c)){dn.add(c.c);D(c.c)}});
  if(trSel===code){trSel=null}else{trSel=code;U(code);D(code)}

  <div><p class="row" style="margin:0 0 6px"><span class="chip">${tx('เกณฑ์ข้อ','Criterion')} ${n}</span><span class="chip mute">${tx('หลักสูตรเทคโนโลยีวิศวกรรมอุตสาหการ (สมมติ)','Industrial Engineering Technology (mock)')}</span></p><h1>${esc(L(CRN[i]))}</h1><p class="lead">${tx('ทำ 2 ขั้นตามลำดับ: อุ่นเครื่องด้วยกรณีศึกษาของเกณฑ์นี้ แล้วประเมินเกณฑ์เดียวกันในเล่ม SER IET ด้วย PEV Studio','Two steps in order: warm up with this criterion’s cases, then rate the same criterion in the IET SER with PEV Studio.')}</p></div>
  <ol class="csteps"><li class="${dn>=tot?'ok':''}"><b>1</b><span><b>${tx('อุ่นเครื่อง','Warm-up')}</b><br>${tx(`กรณีศึกษา ${dn}/${tot}`,`${dn}/${tot} cases`)}</span></li><li><b>2</b><span><b>${tx('ประเมินในเล่ม SER','Rate in the SER')}</b><br>PEV Studio · 2 · Pre-visit 1</span></li><li><b>3</b><span><b>${tx('สัญญาณ → คำขอ','Signal → request')}</b><br>PEV Studio · 3 · ${tx('ขอเอกสาร','Request')}</span></li></ol>
  <h2 class="h2s">1 · ${tx('อุ่นเครื่อง: กรณีศึกษาเกณฑ์ข้อ','Warm-up: cases for criterion')} ${n}</h2>
  <p class="note" style="margin-top:-8px">${tx('อ่านสถานการณ์แล้วเลือกระดับ เฉลยแสดงทันทีและเปลี่ยนคำตอบไม่ได้ ผลนับรวมในเกณฑ์ผ่านชุดกรณีศึกษา 80%','Choose a level for each situation. The answer shows at once and is locked; results count toward the 80% case-study pass mark.')}</p>
  <section class="card pad wsq"><h3 style="margin-top:0">${tx('ทำอุ่นเครื่องร่วมกันแบบ Quiz & Poll','Run the warm-up together as a Quiz & Poll')}</h3><p class="note" style="margin:4px 0 8px">${tx(`กรณีศึกษา ${tot} ข้อของเกณฑ์นี้บนจอหน้าห้อง ผู้อบรมสแกน QR แล้วโหวตจากมือถือ ตั้งเวลาได้ กด Start / Stop แล้วเฉลย`,`This criterion's ${tot} cases on the room screen; participants scan the QR code and vote by phone. Set the timer, press Start / Stop, then reveal.`)}</p>${wsBtn(n,tx(`เปิดจอ Quiz & Poll · อุ่นเครื่องเกณฑ์ข้อ ${n}`,`Open Quiz & Poll · criterion ${n} warm-up`))}</section>
  ${srcNote()}${caseSet(i)}
  <h2 class="h2s">2 · ${tx('ประเมินเกณฑ์ข้อ','Rate criterion')} ${n} ${tx('ในเล่ม SER IET','in the IET SER')}</h2>
  <section class="card pad"><div class="two"><div><h3>${tx('อ่านตรงไหน','Where to read')}</h3><p style="margin:6px 0 0">${esc(L(CRREAD[i]))}</p>
   <h3 style="margin-top:14px">${tx('ตอบ 2 คำถาม','Answer two questions')}</h3><ol class="dots"><li>${tx('ระบบที่หลักสูตรออกแบบไว้เป็นไปตามเกณฑ์ข้อนี้หรือไม่ อ้างตารางหรือหัวข้อ','Does the designed system meet this criterion? Cite the table or item.')}</li><li>${tx('มีสัญญาณใดในเล่มว่าการปฏิบัติจริงอาจไม่ตรงกับระบบนั้น ถ้ามี ใส่เป็นคำขอเอกสารของเกณฑ์นี้ ถ้าต้องดูของจริง จดไว้สำหรับแผนตรวจเยี่ยม','What signals suggest practice may differ from that system? Turn them into requests for this criterion, or note them for the visit plan if only the real thing will show it.')}</li></ol></div>
   <div><h3>${tx('บันทึกใน PEV Studio','Record in PEV Studio')}</h3><ul class="dots"><li>${tx(`ขั้น 2 · Pre-visit 1 › เกณฑ์ข้อ ${n} มี ${CRITEMS[i]} ข้อ ให้ระดับพร้อมหลักฐาน`,`Step 2 · Pre-visit 1 › criterion ${n} has ${CRITEMS[i]} items; rate each with evidence`)}</li><li>${tx(`ขั้น 3 · ขอเอกสารเพิ่มเติม › เกณฑ์ข้อ ${n} (ทั้งเล่มรวมไม่เกิน 8 รายการ)`,`Step 3 · Document request › criterion ${n} (at most eight requests in all)`)}</li></ul>
   <label class="note" for="cn-${n}" style="display:block;margin-top:12px">${tx('บันทึกของฉัน (เก็บในเครื่องนี้)','My notes (kept on this device)')}</label><textarea id="cn-${n}" data-cn="${n}" rows="4" style="width:100%;box-sizing:border-box;margin-top:4px;background:var(--paper);border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;font:inherit">${esc((S.cn||{})[n]||'')}</textarea>
   <p class="row" style="margin-top:10px"><a class="btn" href="${PEVS_URL}" target="_blank" rel="noopener">${tx('เปิด PEV Studio','Open PEV Studio')} ↗</a></p></div></div></section>
  ${ONS_INS?`<section class="card pad keyb"><h2>${tx('เฉลยของเกณฑ์นี้ (เฉพาะวิทยากร)','Key for this criterion (facilitators only)')}</h2><p style="margin:6px 0">${esc(k.iss)}</p><p class="row" style="gap:10px">PV1 ${lvChip(k.l[0])} PV2 ${lvChip(k.l[1])} ${tx('หลังตรวจเยี่ยม','After visit')} ${lvChip(k.l[2])}</p><p class="note">${tx('ซองที่ปล่อย','Envelope')}: ${esc(k.env)}<br>${tx('ยืนยันกับ','Confirm with')}: ${esc(k.src)}</p></section>`:''}
  <nav class="pn">${n>1?`<a href="#crit-${n-1}">‹ ${tx('ข้อ','Criterion')} ${n-1} ${esc(L(CRN[n-2]))}</a>`:`<a href="#on-1">‹ ${tx('ขั้นที่ 2','Step 2')}</a>`}${n<8?`<a href="#crit-${n+1}">${tx('ข้อ','Criterion')} ${n+1} ${esc(L(CRN[n]))} ›</a>`:`<a href="#on-1">${tx('ขั้นที่ 2','Step 2')} ›</a>`}</nav>`;
}

let goAg=null;
function render(keep){
  const id=(location.hash||'#path').slice(1), y=keep?window.scrollY:0;
  nav(id);
  const m=id.match(/^(ep|quiz|mod)-(\d+)$/);
  const cm=id.match(/^crit-(\d)$/), od=id.match(/^on-([012])$/), mk=id.match(/^mock-([\d-]+)$/);
  view.innerHTML=m?(m[1]==='ep'?ep(+m[2]):m[1]==='mod'?mod(+m[2]):quiz(+m[2])):cm?crit(+cm[1]):od?onDay(+od[1]):mk?mockPage(mk[1]):({learn,analysis,serlab,transcript,cases,onsite,record,mock:mockIndex,'on-bs':onBs,'on-key':onKey}[id]||home)();
  window.scrollTo(0,y);
  if(goAg){const el=document.getElementById('ag-'+goAg);goAg=null;if(el){el.scrollIntoView({block:'center'});el.classList.add('flash')}}
}
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;lang=b.dataset.lang;try{localStorage.setItem('tabee-lang',lang)}catch(_){}render(true)});
view.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return; const d=t.dataset;
  if(d.vid!==undefined){openVid(+d.vid);return}
  if(d.vbypass){S.vbypass=true;save();render(true);return}
  if(d.q!==undefined&&!run.done){run.ans[+d.q]=+d.k;render(true)}
  else if(d.submit){const m=+d.submit,Q=run.set.map(i=>QZ[m][i]),ok=Q.filter((q,i)=>run.ans[i]===q.a).length,pct=Math.round(ok/Q.length*100),r=S.quiz[m]||{best:0,tries:0};r.best=Math.max(r.best,pct);r.tries++;S.quiz[m]=r;run.done=true;save();render()}
  else if(d.retry){run=null;render()}
  else if(d.ct!==undefined){caseTab=+d.ct;render(true)}
  else if(d.ws!==undefined){S.ws=S.ws||{};S.ws[+d.ws]=S.ws[+d.ws]===d.k?undefined:d.k;save();render(true)}
  else if(d.case!==undefined){(S.cases[caseTab]=S.cases[caseTab]||{})[+d.case]=d.k;save();render(true)}
  else if(d.ser!==undefined){serTab=+d.ser;render(true)}
  else if(d.del!==undefined){S.ser.splice(+d.del,1);save();render(true)}
  else if(d.key!==undefined){showKey=true;render(true)}
  else if(d.bs!==undefined){bsTab=+d.bs;render(true)}
  else if(d.onk!==undefined){onK=d.onk;render(true)}
  else if(d.bsdel!==undefined){S.bs[bsTab].splice(+d.bsdel,1);save();render(true)}
  else if(d.mt!==undefined){mTab=d.mt;render(true)}
  else if(d.sl!==undefined){const m=+location.hash.slice(5),s=SLIDE[m];slIdx[m]=Math.min(s[2],Math.max(s[1],(slIdx[m]||s[1])+(+d.sl)));render(true)}
  else if(d.slp!==undefined){const m=+location.hash.slice(5);slIdx[m]=+d.slp;render(true)}
});
view.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.watch){S.watched[d.watch]=e.target.checked;save()}
  else if(d.read){S.read[d.read]=e.target.checked;save()}
  else if(d.done){S.done['o:'+d.done]=e.target.checked;save()}
  else if(d.tx){S.tx[d.tx]=e.target.value;save()}
  else if(d.cn){S.cn=S.cn||{};S.cn[d.cn]=e.target.value;save()}});
view.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='f-ser'){S.ser.push({part:$('#s-part').value,text:$('#s-text').value.trim(),lv:$('#s-lv').value,ask:$('#s-ask').value.trim()});save();render(true)}
  else if(e.target.id==='f-bs'){(S.bs[bsTab]=S.bs[bsTab]||[]).push($('#bs-text').value.trim());save();render(true);$('#bs-text').focus()}});
view.addEventListener('click',e=>{const a=e.target.closest('a[data-goag]');if(a)goAg=a.dataset.goag});
window.addEventListener('hashchange',()=>{if(!/^#quiz-/.test(location.hash))run=null;if(/^#mod-/.test(location.hash))mTab='read';render()});
document.addEventListener('keydown',e=>{if(mTab!=='slides'||!/^#mod-/.test(location.hash)||/input|textarea|select/i.test(e.target.tagName))return;const b=document.querySelector(e.key==='ArrowRight'?'[data-sl="1"]':e.key==='ArrowLeft'?'[data-sl="-1"]':null);if(b&&!b.disabled)b.click()});
/* sidebar: drawer on small screens, phase memory, in-page jumps */
const sideEl=$('#side'), scrim=$('#scrim'), menuB=$('#menu');
function drawer(open){document.body.classList.toggle('drawer',open);scrim.hidden=!open;menuB.setAttribute('aria-expanded',open);if(open){const c=$('#sideClose');c&&c.focus()}}
menuB.addEventListener('click',()=>drawer(true));
scrim.addEventListener('click',()=>{drawer(false);menuB.focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('drawer')){drawer(false);menuB.focus()}});
sideEl.addEventListener('click',e=>{
  if(e.target.closest('#sideClose')){drawer(false);menuB.focus();return}
  const j=e.target.closest('[data-jump]');
  if(j){const el=document.getElementById(j.dataset.jump);if(el){drawer(false);el.scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(e.target.closest('a'))drawer(false);
});
sideEl.addEventListener('toggle',e=>{const d=e.target.closest('details[data-ph]');if(d&&sideOpen)sideOpen[d.dataset.ph]=d.open},true);
$('#vclose').addEventListener('click',closeVid);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#vdock').hidden)closeVid()});
render();
</script>
