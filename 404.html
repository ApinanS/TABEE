<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ไม่พบหน้านี้ · Not found</title>
<script>
/* Old Quiz & Poll addresses (bookmarks, printed QR codes) were at the site root:
   assesstrain/, assesstrain1-8/        -> pev-training/assesstrain*/
   assesstrain-etc/, assesstrain-etc1-8/ -> pev-training-etc/assesstrain-etc*/
   Forward them, keeping ?join=… and #hash. */
(function(){
  var m=location.pathname.match(/^(.*?\/)(assesstrain(-etc)?[1-8]?)(\/.*)?$/);
  if(m && !/\/pev-training(-etc)?\/$/.test(m[1])){
    var dest=m[1]+(m[3]?'pev-training-etc/':'pev-training/')+m[2]+'/'+((m[4]||'/').slice(1));
    location.replace(dest+location.search+location.hash);
    document.documentElement.setAttribute('data-moved','1');
  }
})();
</script>
<style>body{font-family:system-ui,sans-serif;padding:32px;line-height:1.6;color:#222;background:#fff}a{color:#1a56db}html[data-moved] .nf{display:none}html:not([data-moved]) .mv{display:none}</style>
</head><body>
<p class="mv">กำลังพาไปยังที่อยู่ใหม่… · Redirecting to the new address…</p>
<div class="nf"><h1>ไม่พบหน้านี้</h1><p>Page not found. <a href="/TABEE/">กลับหน้าหลัก TABEE Studio</a></p></div>
</body></html>
