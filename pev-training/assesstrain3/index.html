<style>
:root{--br:#7B1E2E;--ink:#1B1A1F;--paper:#F6F4EF;--rule:#E4E0D8;--soft:#5C5A63;
--N:#2E7D4F;--Nt:#E6F2EA;--R:#F2C94C;--Rt:#FBF2D2;--C:#A65A16;--Ct:#F6E8DA;--W:#1F5AA6;--Wt:#E3ECF8;--D:#B3242B;--Dt:#F8E2E3}
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.6 "IBM Plex Sans Thai",Prompt,system-ui,sans-serif;color:var(--ink);background:var(--paper)}
button{font:inherit;cursor:pointer}
header{background:var(--br);color:#fff;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700}header .sp{flex:1}
.st{font-size:12.5px;padding:3px 10px;border-radius:99px;background:#ffffff26}.st.ok{background:#2e8b57}.st.fail{background:#00000055}
.hb{background:#fff;color:var(--br);border:0;border-radius:8px;padding:5px 12px;font-weight:600;font-size:13.5px}
.hb.g{background:#ffffff22;color:#fff}
main{max-width:1500px;margin:0 auto;padding:14px 18px 40px}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qnav button{width:42px;height:38px;border-radius:10px;border:1.5px solid var(--rule);background:#fff;font-weight:700}
.qnav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.qnav button.done{border-color:var(--N);color:var(--N)}.qnav button.on.done{color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:18px 20px}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--br);background:#f6e3e7;border-radius:99px;padding:2px 12px}
h2{font-size:clamp(20px,2.2vw,30px);line-height:1.3;margin:8px 0 10px}
.scn{font-size:clamp(16px,1.45vw,21px);line-height:1.7}
.img{margin:0 0 14px}.img img{width:100%;aspect-ratio:16/9;max-height:34vh;object-fit:cover;border-radius:12px;display:block}.img figcaption{font-size:11.5px;color:var(--soft);margin-top:3px}
.ask{margin-top:12px;font-weight:600;color:var(--br)}
.side{display:flex;flex-direction:column;gap:14px}
.join{display:flex;gap:14px;align-items:center}.qr{width:150px;height:150px;flex:none;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:6px}.qr svg,.qr img{width:100%;height:100%;display:block}
.room{font-size:34px;font-weight:800;letter-spacing:.12em;color:var(--br);line-height:1.1}.url{font-size:11.5px;color:var(--soft);word-break:break-all}
.note{font-size:13px;color:var(--soft)}.warn{font-size:13px;background:#fdf5d6;border:1px solid #e9cf6a;border-radius:10px;padding:8px 10px}
.timer{font-size:clamp(54px,6vw,84px);font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.timer.run{color:var(--br)}.timer.low{color:var(--D)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.pill{border:1.5px solid var(--rule);background:#fff;border-radius:99px;padding:6px 14px;font-weight:600}.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.big{border:0;border-radius:12px;padding:11px 22px;font-weight:700;font-size:17px;color:#fff;background:var(--N)}.big.stop{background:var(--D)}.big.rev{background:var(--br)}.big.sec{background:#fff;color:var(--ink);border:1.5px solid var(--rule)}
.big[disabled],.pill[disabled]{opacity:.4;cursor:default}
.cnt{text-align:center;font-size:15px;margin-top:8px}.cnt b{font-size:26px;color:var(--br)}
.res{margin-top:16px}
.bar{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;margin:9px 0}
.bar .l{font-weight:700;display:flex;align-items:center;gap:7px}.dot{width:12px;height:12px;border-radius:50%;flex:none}
.bar .tr{height:30px;background:#f3ece3;border-radius:8px;overflow:hidden}.bar .f{height:100%;width:0;border-radius:8px;transition:width .8s}
.bar .n{font-weight:700;text-align:right}
.bar.key .tr{outline:3px solid var(--ink);outline-offset:2px}
.names{grid-column:2/4;display:flex;flex-wrap:wrap;gap:5px;margin-top:-3px}.names span{font-size:13px;border-radius:99px;padding:1px 10px;border:1px solid}
.hid{text-align:center;color:var(--soft);padding:26px 10px;border:2px dashed var(--rule);border-radius:12px}
.sol{margin-top:14px;border-radius:12px;padding:14px 16px;font-size:clamp(15px,1.3vw,19px);border:2px solid}
.sol b.k{display:inline-block;color:#fff;border-radius:99px;padding:1px 14px;margin-right:6px}
.board{width:100%;border-collapse:collapse;font-size:14.5px}.board td,.board th{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left}.board td.c{text-align:center}
.cell{display:inline-block;width:22px;height:22px;border-radius:6px;line-height:22px;text-align:center;font-size:12px;font-weight:700;color:#fff}
.ovl{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}.ovl.on{display:flex}
.ovl .box{background:#fff;border-radius:16px;max-width:1000px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px}
.ovl textarea{width:100%;height:240px;font:12.5px ui-monospace,monospace}
.chs{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px}
.ch{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--c);background:var(--t);border-radius:99px;padding:8px 18px;font-weight:700;font-size:clamp(15px,1.3vw,19px);color:var(--ink)}
.ch .dot{background:var(--c)}.ch:not([disabled]):hover{background:var(--c);color:#fff}.ch:not([disabled]):hover .dot{background:#fff}
.ch[disabled]{cursor:default}.ch.key{background:var(--c);color:#fff;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c)}.ch.key .dot{display:none}
.ch[data-ch="R"]:not([disabled]):hover,.ch[data-ch="R"].key{color:#3a2c00}
/* voter */
.v{max-width:560px;margin:0 auto;padding:16px}
.v input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--rule);border-radius:12px}
.vopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:9px 0;padding:14px 16px;border-radius:14px;border:2px solid;font-weight:700;font-size:18px}
.vopt .dot{width:16px;height:16px}.vopt.sel{color:#fff}.vopt[disabled]{opacity:.5}.vopt.sel[disabled]{opacity:1}
.vt{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--br)}
.vmsg{text-align:center;padding:30px 10px;color:var(--soft)}

/* Theme v2: presenter screen is dark for the projector; phones (?join=) stay light */
h2,.room,.timer,.big,.cnt b{font-family:Prompt,system-ui,sans-serif}
html.pres{--ink:#F4F1EA;--paper:#141317;--rule:#34313A;--soft:#BDB8AE}
html.pres .card{background:#1F1D23;border-color:#34313A}
html.pres .qnav button,html.pres .pill,html.pres .big.sec{background:transparent;color:#F4F1EA;border-color:#4A4650}
html.pres .qnav button.on,html.pres .pill.on{background:#F4F1EA;color:#141317;border-color:#F4F1EA}
html.pres .bar .tr{background:#2A282E}
html.pres .tag{background:transparent;color:#F2C94C;border:2px solid #F2C94C}
html.pres .ask,html.pres .room,html.pres .cnt b,html.pres .timer.run{color:#F4F1EA}
html.pres .big.rev{background:#7B1E2E}
html.pres .hid{border-color:#4A4650}
html.pres .warn{background:#3A2B0F;border-color:#6B5200;color:#F4F1EA}
html.pres .board td,html.pres .board th{border-color:#34313A}
html.pres .ovl .box{background:#1F1D23;color:#F4F1EA}
html.pres .bar.key .tr{outline-color:#F4F1EA}
html.pres .names span{border-color:#4A4650}
.big,.pill,.qnav button{min-height:44px}

/* level choices: letter tag, same as the Studio */
.ch{--i:#1B1A1F;color:var(--i);border-radius:14px;padding:6px 18px 6px 6px;min-height:52px}
.ch .dot{display:none}
.ch::before{content:attr(data-ch);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:#fff;font:700 16px Prompt,sans-serif}
.ch[data-ch="R"]::before{color:#3A2C00}
.ch[data-ch="N"]{--i:#1E5A38}.ch[data-ch="R"]{--i:#6B5200;border-color:#C9A227}.ch[data-ch="C"]{--i:#7A400C}.ch[data-ch="W"]{--i:#1A4A88}.ch[data-ch="D"]{--i:#8E1C22}
.ch:not([disabled]):hover::before,.ch.key::before{background:#fff;color:var(--c)}
.ch[data-ch="R"]:not([disabled]):hover::before,.ch[data-ch="R"].key::before{color:#6B5200}
.ch.key{box-shadow:none;outline:3px solid var(--c);outline-offset:3px}
</style>

const SETS=[{"t":"เกณฑ์ข้อ 1 นิสิต นักศึกษา","items":[{"q":"ในการตรวจประเมินหลักสูตรวิศวกรรมศาสตร์ พบว่าหลักสูตรมีกระบวนการรับนักศึกษาที่ชัดเจนและมีเกณฑ์การคัดเลือกที่เป็นระบบ แต่จากการสุ่มสัมภาษณ์นักศึกษาชั้นปีที่ 1 และ 2 พบว่านักศึกษาไม่ทราบถึงความสำคัญของผลลัพธ์การศึกษา Program Outcomes - POs) และไม่สามารถอธิบายได้ว่าวิชาที่เรียนเชื่อมโยงกับทักษะวิศวกรในอนาคตได้อย่างไร ผู้ประเมินควรตัดสินผลประเมินในเกณฑ์ที่ 1 อย่างไร","a":"R","s":"แม้หลักสูตรจะมีระบบการรับนักศึกษาตามเกณฑ์ แต่การที่นักศึกษาไม่เข้าใจ PO อาจส่งผลต่อประสิทธิภาพของ OBE ในระยะยาว อย่างไรก็ตาม หากยังไม่ส่งผลเสียต่อการบรรลุเป้าหมายของนักศึกษาอย่างชัดเจนในขณะนั้น ควรให้เป็น Remark เพื่อให้หลักสูตรปรับปรุงวิธีการสื่อสาร"},{"q":"หลักสูตรมีกระบวนการให้คำปรึกษาทางวิชาการโดยอาจารย์ที่ปรึกษา แต่ผลการวิเคราะห์ข้อมูลย้อนหลัง 3 ปี พบว่าอัตราการสำเร็จการศึกษาตามแผนการเรียน (On-time Graduation) ต่ำกว่าร้อยละ 40 โดยที่หลักสูตรไม่มีแผนงานหรือมาตรการแก้ไขปัญหาเชิงรุกที่เป็นรูปธรรมในการติดตามและช่วยเหลือนักศึกษาที่มีผลการเรียนต่ำ สถานการณ์นี้ตรงกับนิยามใดมากที่สุด","a":"W","s":"การมีอัตราการจบการศึกษาต่ำโดยไม่มีแผนปรับปรุงแสดงถึงการขาดประสิทธิภาพในระบบการดูแลนักศึกษา (Student Support) ซึ่งเป็นหัวใจสำคัญของเกณฑ์ที่ 1 ถือเป็นความบกพร่องที่ส่งผลกระทบต่อคุณภาพหลักสูตร แต่ยังไม่ถึงขั้นขาดกระบวนการโดยสิ้นเชิง จึงจัดเป็น Weakness"},{"q":"จากการตรวจสอบเอกสารหลักฐาน พบว่าหลักสูตรมีการรับโอนนักศึกษาจากต่างสถาบันเข้ามาในช่วงชั้นปีที่ 3 แต่หลักสูตรไม่มีเอกสารการเทียบโอนรายวิชาที่แสดงถึงการประเมินความสอดคล้องของผลลัพธ์การศึกษา (Program Outcome) โดยใช้วิธีการดูเพียงชื่อวิชาและหน่วยกิตให้เท่ากันเท่านั้น ท่านในฐานะ PEV จะตัดสินผลอย่างไร","a":"W","s":"มาตรฐาน TABEE เน้นย้ำเรื่องการควบคุมคุณภาพการโอนย้ายนักศึกษา หากหลักสูตรไม่มีกระบวนการประเมินว่านักศึกษาที่โอนมามีสมรรถนะเทียบเท่ากับนักศึกษาในหลักสูตรจริงหรือไม่ (Outcome-based Transfer) ถือว่าขาดกลไกสำคัญในการรักษามาตรฐานวิชาชีพ"},{"q":"หลักสูตรมีระบบฐานข้อมูลติดตามการทำงานของบัณฑิตและมีการสำรวจความพึงพอใจของผู้ใช้บัณฑิตเป็นประจำทุกปี อย่างไรก็ตาม พบว่าในปีล่าสุดมีการเปลี่ยนหัวหน้าสาขาทำให้ข้อมูลการสำรวจบางส่วนสูญหายไปและไม่สามารถนำมาใช้ประกอบการรายงานผลการประเมินตนเอง (SER) ได้อย่างครบถ้วน แต่ระบบหลักยังคงทำงานอยู่ สถานการณ์นี้ควรระบุเป็นผลประเมินระดับใด","a":"C","s":"ระบบยังมีอยู่และทำงานได้ แต่เกิดความบกพร่องเฉพาะหน้าเรื่องข้อมูลสูญหาย ซึ่งหากปล่อยไว้หรือไม่หาวิธีสำรองข้อมูล (Backup) อาจนำไปสู่ความเสี่ยงที่จะขาดข้อมูลหลักฐานในอนาคต จึงจัดเป็น Concern"},{"q":"ในการตรวจประเมินเกณฑ์ข้อที่ 1.4 การตรวจสอบความพร้อมเพื่อจบการศึกษา (Graduation Requirements) พบว่าหลักสูตรใช้เพียงเกณฑ์การสอบผ่านทุกรายวิชาและมีแต้มระดับคะแนนเฉลี่ยสะสม (GPAX) ตามเกณฑ์ แต่ไม่มีกลไกในการตรวจสอบว่านักศึกษาแต่ละคนบรรลุ PO ครบทุกข้อก่อนจบการศึกษาตามแนวทาง OBE ท่านควรให้ความเห็นอย่างไร","a":"W","s":"หัวใจของ TABEE คือการรับประกันว่าผู้จบการศึกษาต้องบรรลุสมรรถนะตามที่กำหนด หากหลักสูตรยังใช้เพียงเกณฑ์ GPAX โดยไม่มีระบบตรวจสอบและติดตามผลการเรียนรายบุคคลของนักศึกษาว่าบรรลุ POs หรือไม่ ถือเป็นจุดอ่อนสำคัญที่ต้องได้รับการแก้ไขเพื่อให้สอดคล้องกับมาตรฐานคุณภาพ"}]},{"t":"เกณฑ์ข้อ 2 วัตถุประสงค์หลักสูตร","items":[{"q":"ในรายงานประเมินตนเอง (SER) หลักสูตรระบุ PEOs 4 ข้อที่ทันสมัย แต่จากการสุ่มตรวจบันทึกการประชุมคณะกรรมการที่ปรึกษาอุตสาหกรรม (IAB) ย้อนหลัง 6 ปี พบเพียงรายชื่อผู้เข้าร่วมประชุม แต่ไม่มีวาระการประชุมหรือบันทึกที่แสดงถึงการให้ความเห็นต่อ PEOs เลย คณาจารย์ในหลักสูตรยืนยันว่าได้หารือกันด้วยวาจาแต่ไม่ได้จดบันทึกไว้ ท่านจะวินิจฉัยกรณีนี้อย่างไร","a":"W","s":"เกณฑ์ข้อ 2.2 และ 2.3 กำหนดชัดเจนว่า PEOs ต้องถูกกำหนดและทบทวนตามความต้องการของ 'ผู้มีส่วนได้ส่วนเสีย' โดยต้องมีกระบวนการที่เป็นระบบ (Systematic Process) การไม่มีหลักฐานบันทึกการหารือกับ Stakeholders เลย ถือว่าขาดกลไกในการพิสูจน์ที่มาของวัตถุประสงค์หลักสูตร"},{"q":"หลักสูตรหนึ่งระบุ PEO ข้อที่ 1 ว่า \"นิสิตสามารถใช้โปรแกรม AutoCAD และ SolidWorks ในการออกแบบชิ้นงานวิศวกรรมได้อย่างเชี่ยวชาญก่อนจบการศึกษา\" PEV พิจารณาแล้วเห็นว่าข้อความนี้มุ่งเน้นไปที่ทักษะในระยะสั้นมากกว่าความสำเร็จในสายอาชีพหลังจากสำเร็จการศึกษาไปแล้ว 3-5 ปี ท่านควรตัดสินอย่างไร","a":"W","s":"วัตถุประสงค์หลักสูตร (PEOs) ตามนิยามของ TABEE/ABET คือสิ่งที่คาดหวังว่าบัณฑิตจะบรรลุหลังจากจบไปแล้ว 'ระยะหนึ่ง' (3-5 ปี) การนำทักษะที่ควรเป็น PLOs (สิ่งที่ต้องทำได้เมื่อจบ) มาเขียนเป็น PEOs แสดงถึงความไม่เข้าใจในเชิงโครงสร้างของ OBE ซึ่งเป็นข้อด้อยที่ต้องแก้ไข"},{"q":"หลักสูตรมี PEOs ที่ผ่านการประชาสัมพันธ์อย่างดีและมีส่วนร่วมจาก Stakeholders ครบถ้วน แต่สถาบันการศึกษาเพิ่งมีการปรับเปลี่ยนพันธกิจ (Mission) ใหม่เพื่อเน้น 'การเป็นมหาวิทยาลัยแห่งนวัตกรรมและผู้ประกอบการ' แต่หลักสูตรยังไม่ได้ปรับปรุงตารางแสดงความสอดคล้อง (Mapping) ระหว่าง PEOs เดิมกับพันธกิจใหม่ให้เห็นชัดเจนใน SER","a":"C","s":"แม้ PEOs ปัจจุบันอาจจะยังใช้งานได้ แต่การที่ยังไม่มีการเปรียบเทียบความสอดคล้องกับพันธกิจสถาบัน (Institutional Mission) ตามเกณฑ์ข้อ 2.1 ถือเป็นความเสี่ยง (Potential risk) ที่อาจทำให้ PEOs ไม่ตอบสนองต่อทิศทางของสถาบันในอนาคต จึงจัดเป็น Concern"},{"q":"หลักสูตรมีการกำหนดรอบการทบทวน PEOs ทุก 10 ปี และระบุว่าได้ดำเนินการตามรอบนั้นอย่างเคร่งครัด อย่างไรก็ตาม PEV พบว่าในช่วง 5 ปีที่ผ่านมา เทคโนโลยีในสาขานี้มีการเปลี่ยนแปลงอย่างรุนแรง (Disruptive Technology) และผู้ใช้บัณฑิตเริ่มสะท้อนว่าบัณฑิตขาดทักษะใหม่ๆ แต่หลักสูตรยังคงรอรอบเวลาการทบทวนเดิม ท่านจะตัดสินอย่างไร","a":"W","s":"กระบวนการทบทวน (Review Process) ต้องมีประสิทธิภาพและตอบสนองต่อความต้องการของ Stakeholders การกำหนดรอบที่นานเกินไป (10 ปี) จนไม่สอดคล้องกับสภาพจริงของวิชาชีพ ถือเป็นความอ่อนแอของระบบการบริหารจัดการคุณภาพ (CQI) ในระดับวัตถุประสงค์"},{"q":"หลักสูตรดำเนินการตามเกณฑ์ข้อ 2 ครบถ้วน มีหลักฐานเชิงประจักษ์ชัดเจนและสอดคล้องกับพันธกิจ แต่ PEV พบว่าข้อมูล PEOs บนเว็บไซต์ของหลักสูตรเป็นเวอร์ชันเก่า (ยังไม่ได้ Update ตาม SER) แม้ในเล่มคู่มือนักศึกษาและบอร์ดประชาสัมพันธ์จะเป็นเวอร์ชันใหม่แล้วก็ตาม ท่านควรสรุปผลอย่างไร","a":"R","s":"หลักสูตรมีการดำเนินการตามเกณฑ์ (Compliance) และมีการเผยแพร่สู่สาธารณะแล้ว (Publicly accessible) ตามเกณฑ์ข้อ 2.4 แต่ความไม่เป็นปัจจุบันของข้อมูลบนเว็บไซต์เป็นเพียงประเด็นย่อยในการจัดการสารสนเทศ ซึ่งควรให้เป็นข้อสังเกตเพื่อการพัฒนาให้สมบูรณ์ยิ่งขึ้น"}]},{"t":"เกณฑ์ข้อ 3 ผลลัพธ์การศึกษา","items":[{"q":"จากการสุ่มตรวจ Course Portfolio รายวิชาออกแบบวิศวกรรม (Engineering Design) ซึ่งหลักสูตรระบุว่าวัดผลลัพธ์การศึกษาข้อ 3 (PO3: Design) และข้อ 10 (PO10: Management and Finance) แต่ในแฟ้มสะสมงานกลับพบเพียงโจทย์คำนวณทางทฤษฎีในห้องเรียน ไม่มีการระบุถึงข้อจำกัด (Constraints) หรือการวิเคราะห์ความคุ้มค่าเชิงเศรษฐศาสตร์ตามที่ระบุในคำนิยามของ PO ท่านจะตัดสินอย่างไร","a":"W","s":"ตามเกณฑ์ TABEE และหลักการ OBE หลักฐานเชิงประจักษ์ (Evidence) ต้องสะท้อนสมรรถนะตามนิยามของ PO นั้นๆ หากหลักสูตรระบุว่าวัด PO3 และ PO11 แต่โจทย์และงานที่มอบหมายขาดความซับซ้อนและองค์ประกอบสำคัญ (เช่น Constraints/Finance) ถือว่าระบบการวัดผลขาดความเข้มแข็งและไม่สะท้อนความเป็นจริง"},{"q":"หากท่านพบว่าหลักสูตรใช้วิธีการประเมินผลการบรรลุ PO บางตัว โดยการนำ \"เกรดเฉลี่ยสะสมรายวิชา\" (Course Grades) ของวิชาบังคับที่ใช้ในการประเมิน PO นั้น ๆ มาคำนวณและสรุปว่านิสิตที่ได้เกรด C ขึ้นไปบรรลุ PO ดังกล่าว โดยไม่มีการใช้เครื่องมือวัดผลแบบแยกส่วนตามตัวชี้วัดสมรรถนะ (Performance Indicators) ท่านในฐานะ PEV จะวินิจฉัยอย่างไร","a":"W","s":"นี่คือ \"จุดตกม้าตาย\" ของระบบ OBE การใช้เกรดรวมไม่สามารถพิสูจน์ได้ว่านิสิตมีสมรรถนะในแต่ละด้าน (เช่น จรรยาบรรณวิชาชีพ หรือ การสื่อสาร) จริงหรือไม่ เพราะเกรดเป็นการรวมคะแนนหลายส่วนเข้าด้วยกัน การขาดกระบวนการประเมินผลสัมฤทธิ์ตามตัวชี้วัดที่ชัดเจนถือเป็นความบกพร่องอย่างร้ายแรงในระบบการรับรองแบบ TABEE"},{"q":"ในรายวิชาโครงงานวิศวกรรม (Capstone Design) หลักสูตรระบุว่าวัด PO3 (การออกแบบและพัฒนาเพื่อหาคำตอบของปัญหา) แต่จากการสัมภาษณ์นักศึกษาและดูรายงานโครงงาน พบว่าโจทย์ส่วนใหญ่เป็นการออกแบบสิ่งประดิษฐ์ซ้ำตามแบบที่มีอยู่แล้ว (Routine task) ขาดการตั้งสมมติฐาน การออกแบบการทดลอง และการวิเคราะห์ข้อมูลที่มีความซับซ้อนตามนิยาม Complex Engineering Problem ท่านจะตัดสินอย่างไร","a":"W","s":"นิยามของ PO4 ภายใต้ Washington Accord เน้นการแก้ปัญหาวิศวกรรมที่ซับซ้อนผ่านการวิเคราะห์และออกแบบ หากงานโครงงานซึ่งเป็นจุดสูงสุดของหลักสูตรไม่สามารถแสดงให้เห็นถึงทักษะการตั้งสมมติฐาน ออกแบบและแก้ไขปัญหาวิศวกรรมที่ซับซ้อนได้ จะถือเป็นข้อด้อยที่ส่งผลกระทบต่อคุณภาพบัณฑิตวิศวกรรมศาสตร์ตามมาตรฐานสากล"},{"q":"หลักสูตรแสดงตารางความเชื่อมโยง (Mapping) ระหว่างผลลัพธ์การเรียนรู้ที่คาดหวังของหลักสูตร (PLOs) กับผลลัพธ์การศึกษา 11 ข้อของ TABEE ครบถ้วน แต่เมื่อตรวจสอบเครื่องมือวัดผล พบว่าหลักสูตร \"ไม่ได้กำหนดเครื่องมือวัดผลทางตรง\" (Direct Assessment) สำหรับ PO6 (การทำงานร่วมกันเป็นทีม) โดยใช้เพียงการสอบถามความพึงพอใจของนิสิตหลังเรียนจบ (Exit Survey) เท่านั้น ท่านจะตัดสินอย่างไร","a":"W","s":"เกณฑ์ TABEE กำหนดว่า POs ทุกข้อจะต้องได้รับการวัดผลที่เหมาะสม (Appropriate assessment) แม้จะเป็น PO ด้าน Soft Skills (PO4 - PO11 จะต้องประเมินด้วยอย่างน้อย 1 Direct Assessment และ 2 Indirect Assessment) ดังนั้นการใช้เพียงผลสำรวจความพึงพอใจ (Indirect) โดยไม่มีหลักฐานการประเมินพฤติกรรมการทำงานเป็นทีมจริง (เช่น Peer evaluation หรือ Rubrics ในวิชาปฏิบัติ) ถือว่าระบบการประเมินขาดความสมบูรณ์และไม่สามารถยืนยันสมรรถนะได้ ไม่เป็นไปตามข้อกำหนดของ TABEE"},{"q":"จากการตรวจสอบความสอดคล้องระหว่างเนื้อหา (Knowledge Profile: TK) กับ POs พบว่าหลักสูตรมีการสอนและวัดผลความรู้ด้านคณิตศาสตร์และวิทยาศาสตร์ (TK1, TK2) อย่างเข้มข้น แต่ในส่วนของ TK4 (ความรู้ที่บริบทเฉพาะที่เกี่ยวข้องกับการปฏิบัติงานวิศวกรรม เช่น กฎหมายสิ่งแวดล้อม หรือมาตรฐานความปลอดภัย) มีการระบุใน Mapping ว่าสอนในวิชาสัมมนา แต่ใน Course Portfolio กลับไม่มีหลักฐานการวัดผลในหัวข้อดังกล่าวที่ชัดเจน","a":"C","s":"หลักสูตรมีโครงสร้างที่สอดคล้อง (Mapping มีอยู่) แต่หลักฐานเชิงประจักษ์ในกระบวนการวัดผลเริ่มแสดงสัญญาณความไม่สมบูรณ์ (Missing link) หากสถานการณ์นี้ยังไม่กระทบต่อการบรรลุภาพรวมในรอบนี้ แต่มีความเสี่ยงที่จะระบุผลไม่ได้ในอนาคต ควรจัดเป็น Concern เพื่อให้หลักสูตรเร่งจัดระบบหลักฐานให้ชัดเจน"}]},{"t":"เกณฑ์ข้อ 4 การพัฒนาต่อเนื่อง","items":[{"q":"จากการตรวจเอกสารรายงานประเมินตนเอง (SER) พบว่าหลักสูตรมีการจัดส่งแบบสำรวจความพึงพอใจไปยังผู้ประกอบการและบัณฑิตจบใหม่ทุกปี และนำผลคะแนนเฉลี่ยมาแสดงเป็นกราฟเพื่อยืนยันคุณภาพหลักสูตร อย่างไรก็ตาม เมื่อผู้ตรวจประเมินขอดูหลักฐานการประเมินผลลัพธ์การศึกษา (POs) ทางตรง (Direct Assessment) สำหรับ PO ด้านการแก้ปัญหาวิศวกรรมที่ซับซ้อน (PO 2-3) กลับพบว่าหลักสูตรใช้การประเมิน PO จากรายวิชาวิศวกรรมทั่วไปที่ไม่มีลักษณะโจทย์เป็นการแก้ไขปัญหาวิศวกรรมที่ซับซ้อน ท่านจะตัดสินอย่างไร","a":"W","s":"เกณฑ์ข้อ 4 กำหนดว่าต้องมีการประเมินผลลัพธ์การศึกษาที่ระบุไว้ในเกณฑ์ข้อ 3 (11 ข้อ) อย่างเป็นระบบ การใช้เพียงเกรด (Course Grades) โดยไม่มีเครื่องมือประเมินสมรรถนะรายบุคคลตามตัวชี้วัด (PIs) และขาดการประเมินทางตรงสำหรับทักษะวิชาชีพหลัก ถือเป็นการไม่ปฏิบัติตามเกณฑ์อย่างชัดเจน (Deficiency)"},{"q":"หลักสูตรแสดงหลักฐานกระบวนการประเมิน POs ครบถ้วนและมีข้อมูลย้อนหลัง 2 ปี พบว่าคะแนนการประเมินในส่วน PO3 (การออกแบบ) ต่ำกว่าเป้าหมายที่หลักสูตรกำหนดไว้ที่ร้อยละ 70 ต่อเนื่องกันทั้งสองรอบ ในรายงาน CQI หลักสูตรระบุเพียงว่า \"ได้แจ้งให้อาจารย์ผู้สอนเข้มงวดมากขึ้น\" แต่ไม่พบหลักฐานบันทึกการประชุมคณะกรรมการบริหารหลักสูตรที่วิเคราะห์สาเหตุหรือมีการปรับปรุงวิธีการสอน/ทรัพยากรการเรียนรู้อย่างเป็นรูปธรรม ท่านควรให้ผลการประเมินอย่างไร","a":"W","s":"การมีข้อมูลประเมินแต่ไม่นำผลมาใช้วางแผนพัฒนาอย่างเป็นระบบ (Evaluating but not Improving) แสดงถึงความอ่อนแอของวงจร CQI แม้จะมีกระบวนการเริ่มต้นแต่ขาดความเข้มแข็งในการ \"ปิดวงจร\" เพื่อยกระดับคุณภาพการศึกษาตามเป้าหมาย"},{"q":"ในรอบการประเมินปีล่าสุด หลักสูตรได้รับข้อเสนอแนะจากคณะกรรมการที่ปรึกษาภาคอุตสาหกรรม (IAB) ว่าบัณฑิตขาดทักษะด้านความปลอดภัยในการทำงานวิศวกรรม หลักสูตรจึงเพิ่มหัวข้อ \"Safety Standard\" เข้าไปในวิชาสัมมนาทันทีในเทอมถัดมา อย่างไรก็ตาม ผู้ตรวจประเมินพบว่าหลักสูตรยังไม่ได้ออกแบบเครื่องมือประเมิน (Assessment tool) เพื่อวัดว่าการเพิ่มเนื้อหานี้ทำให้นิสิตบรรลุผลลัพธ์การเรียนรู้เพิ่มขึ้นจริงหรือไม่ สถานการณ์นี้จัดอยู่ในระดับใด","a":"C","s":"หลักสูตรมีการตอบสนองต่อ Stakeholders (สอดคล้องเกณฑ์) แต่กระบวนการยังไม่สมบูรณ์ในแง่ของการวัดประสิทธิผลของการปรับปรุง (Effectiveness evaluation) ซึ่งมีความเสี่ยงว่าในอนาคตอาจจะไม่สามารถพิสูจน์การบรรลุผลได้ จึงควรให้เป็น Concern เพื่อเฝ้าระวัง และปรับปรุงต่อไป"},{"q":"หลักสูตรมีการประเมินผลลัพธ์การศึกษา POs ทั้ง 11 ข้อ โดยใช้เครื่องมือที่หลากหลายทั้งทางตรงและทางอ้อม มีการนำผลมาวิเคราะห์และกำหนดแผนพัฒนาวิชา Lab และ Capstone Design Project อย่างชัดเจน แต่ผู้ตรวจประเมินพบว่ากระบวนการแจ้งผลสะท้อนกลับ (Feedback Loop) ไปยังอาจารย์ผู้สอนในรายวิชาต้นน้ำ (ชั้นปีที่ 1-2) ยังไม่เป็นระบบเท่าที่ควร แม้ผลสัมฤทธิ์โดยรวมของบัณฑิตจะอยู่ในเกณฑ์ดีเยี่ยมก็ตาม","a":"R","s":"ระบบการพัฒนาต่อเนื่องทำงานได้ดีและเห็นผลสัมฤทธิ์ชัดเจน ประเด็นเรื่องการสื่อสารข้อมูลระหว่างชั้นปีเป็นเพียงรายละเอียดปลีกย่อยที่สามารถพัฒนาให้ดีขึ้นได้ (Good practice but room for improvement) จึงควรให้เป็น Remark เพื่อเป็นคำแนะนำเชิงสร้างสรรค์"},{"q":"จากการสุ่มตรวจแฟ้มรายวิชา (Course Portfolio) พบว่ามีการประเมินผลนักศึกษาตามตัวชี้วัดสมรรถนะ (PIs) ที่หลักสูตรกำหนดอย่างเคร่งครัด แต่เมื่อตรวจสอบเกณฑ์การตัดสิน (Target/Rubrics) พบว่าหลักสูตรปรับลดเกณฑ์ความสำเร็จ (Attainment level) ลงทุกครั้งที่นักศึกษาทำคะแนนไม่ได้ตามเป้า เพื่อให้ผลการประเมินออกมาว่า \"บรรลุเป้าหมาย\" เสมอ โดยไม่มีการวิเคราะห์เพื่อหาแนวทางแก้ไขที่แท้จริง ท่านในฐานะ PEV จะตัดสินอย่างไร","a":"D","s":"การปรับลดเกณฑ์เป้าหมายเพื่อให้สอบผ่านโดยไม่มีการวิเคราะห์เชิงคุณภาพ ขัดต่อเจตนารมณ์ของเกณฑ์ข้อ 4 ที่เน้น \"คุณภาพการจัดการศึกษา\" และ \"ความต่อเนื่องของการพัฒนา\" ถือเป็นระบบที่ขาดความน่าเชื่อถือและไม่เป็นไปตามมาตรฐานการประกันคุณภาพแบบมุ่งเน้นผลลัพธ์อย่างร้ายแรง"}]},{"t":"เกณฑ์ข้อ 5 รายละเอียดหลักสูตร และ Capstone Project","items":[{"q":"จากการสุ่มตรวจรายงานโครงงานวิศวกรรม (Capstone Design Project) จำนวน 10 เล่ม พบว่าโจทย์ส่วนใหญ่เป็นการสร้างสิ่งประดิษฐ์ตามแบบที่มีอยู่แล้ว (Routine Application) โดยไม่มีการระบุข้อจำกัดเชิงวิศวกรรม (Engineering Constraints) เช่น ด้านเศรษฐศาสตร์ ความปลอดภัย หรือสิ่งแวดล้อม และไม่มีการเปรียบเทียบทางเลือกในการออกแบบ (Alternative Solutions) ท่านจะตัดสินผลประเมินอย่างไร","a":"D","s":"หัวใจของ Capstone Design คือการแก้ปัญหาทางวิศวกรรมที่ซับซ้อน (Complex Engineering Problems) ซึ่งต้องมีองค์ประกอบของข้อจำกัด (Constraints) และการสังเคราะห์หาทางเลือก หากขาดสิ่งเหล่านี้ถือว่าไม่เป็นไปตามเกณฑ์มาตรฐานขั้นต่ำของ TABEE อย่างชัดเจน"},{"q":"ในเล่มหลักสูตรระบุว่ามีการสอนและวัดผลความรู้ด้าน \"ความยั่งยืนและผลกระทบต่อสิ่งแวดล้อม (TK5)\" ในรายวิชาออกแบบ แต่อาจารย์ผู้สอนระบุว่าเนื้อหาดังกล่าวเน้นเพียงการบรรยายทฤษฎีในห้องเรียน และใน Course Portfolio ไม่พบหลักฐานการประเมินสมรรถนะนิสิตในด้านนี้ที่เป็นรูปธรรมผ่านงานออกแบบหรือโครงงาน ท่านควรวินิจฉัยอย่างไร","a":"W","s":"เกณฑ์ข้อ 5 กำหนดว่าหลักสูตรต้องมีความลึกของเนื้อหาที่ครอบคลุม Knowledge Profile (TK) ที่จำเป็น การมีเนื้อหาแต่ขาดการวัดผลสัมฤทธิ์ที่เป็นหลักฐานเชิงประจักษ์ (Evidence-based) ในวิชาชีพถือเป็นข้อด้อยที่ต้องได้รับการปรับปรุงระบบการสอนและการประเมิน"},{"q":"หลักสูตรมีโครงสร้างรายวิชาเป็นไปตามมาตรฐานวิชาชีพ แต่พบว่าวิชา \"การออกแบบวิศวกรรมระดับสูง\" ซึ่งเป็นวิชาเตรียมก่อน Capstone Design Project นิสิตส่วนใหญ่สามารถลงทะเบียนเรียนได้โดยไม่จำเป็นต้องสอบผ่านวิชา \"พื้นฐานการออกแบบ\" (Prerequisite) ส่งผลให้ในเทอมล่าสุดมีนิสิตจำนวนมากขาดทักษะพื้นฐานจนส่งผลต่อคุณภาพของโครงงานวิศวกรรม","a":"W","s":"หลักสูตรปล่อยให้ลำดับการเรียน (Course Sequencing) ขาดระบบการดูแลที่เข้มงวด ทำให้นักศึกษาที่ยังไม่ได้เรียนวิชา Prerequisite สามารถลงทะเบียนวิชาตัวต่อได้ ก่อให้เกิดปัญหาคุณภาพของการเรียนการสอน ต้องดำเนินการแก้ไ"},{"q":"ในรายวิชา Capstone Design Project หลักสูตรมีการแบ่งกลุ่มนิสิตทำโครงงานกลุ่มละ 3 คน แต่ระบบการให้คะแนนและการประเมินผล (Rubrics) ใช้วิธีการให้คะแนนแบบ \"กลุ่ม\" เท่ากันทุกคน โดยไม่มีเครื่องมือวัดสมรรถนะรายบุคคล (Individual Attainment) สำหรับ PO ด้านการทำงานเป็นทีม (PO6) และการสื่อสาร (PO7) ตามที่ TABEE กำหนด","a":"W","s":"การประเมินผลสัมฤทธิ์ (Assessment) ในระบบ OBE ต้องพิสูจน์ได้ว่านิสิต \"แต่ละคน\" บรรลุผลลัพธ์การศึกษา การให้คะแนนกลุ่มโดยไม่แยกแยะสมรรถนะรายบุคคลทำให้ไม่สามารถยืนยันได้ว่านิสิตทุกคนมีความสามารถตามเกณฑ์จริง ถือเป็นจุดอ่อนสำคัญของระบบการวัดผล"},{"q":"หลักสูตรแสดงให้เห็นว่ามีการบูรณาการความรู้จากสาขาที่เกี่ยวข้อง (Integrated Design Experience) ไว้ใน Capstone Project อย่างดีเยี่ยม มีที่ปรึกษาจากภาคอุตสาหกรรม และนิสิตสามารถแสดงการประยุกต์ใช้มาตรฐานวิชาชีพ (Professional Standards) ได้อย่างครบถ้วน แต่ PEV พบว่าห้องปฏิบัติการที่ใช้ทำโครงงานมีพื้นที่จำกัดและค่อนข้างแออัดในช่วงปลายเทอม แม้นิสิตจะยังทำงานได้ตามเป้าหมายก็ตาม PAT: ข้อนี้น่าจะอยู่ในเกณฑ์ข้อ 7","a":"R","s":"เมื่อผลสัมฤทธิ์ของโครงงาน (Student Outcome) อยู่ในระดับดีเยี่ยมและบรรลุเกณฑ์ข้อ 5 ประเด็นเรื่องพื้นที่การทำงานที่เป็นปัจจัยสนับสนุน (Criteria 7) แต่ยังไม่ส่งผลกระทบต่อคุณภาพงานในขณะนั้น ควรให้เป็นข้อสังเกตเพื่อเป็นแนวทางในการของบประมาณขยายพื้นที่ในอนาคต"}]},{"t":"เกณฑ์ข้อ 6 คณาจารย์","items":[{"q":"จากการตรวจสอบภาระงาน (Workload) ของอาจารย์ผู้รับผิดชอบหลักสูตร พบว่าอาจารย์ส่วนใหญ่มีภาระงานสอนเกิน 15 ชั่วโมงต่อสัปดาห์ และต้องรับผิดชอบงานบริหารระดับคณะควบคู่ไปด้วย ส่งผลให้หลักฐานใน Course Portfolio ย้อนหลัง 2 ปี ไม่มีการวิเคราะห์ผลการประเมินเพื่อปรับปรุงรายวิชา (Closing the loop) ตามวงจร CQI ท่านจะวินิจฉัยกรณีนี้อย่างไร","a":"W","s":"เกณฑ์ข้อ 6 กำหนดว่าภาระงานของอาจารย์ต้องมีความเหมาะสมเพื่อให้มีเวลาเพียงพอในการปรับปรุงหลักสูตรและพัฒนาการเรียนการสอน การที่ภาระงานล้นจนไม่สามารถดำเนินการ CQI ได้ ถือเป็นความอ่อนแอของระบบ (Lacks strength of compliance) ที่กระทบต่อคุณภาพหลักสูตรโดยตรง"},{"q":"ในการตรวจประเมินหลักสูตรวิศวกรรมไฟฟ้า พบว่ารายวิชาบังคับด้าน \"การออกแบบระบบไฟฟ้า\" และ \"เครื่องกลไฟฟ้า\" สอนโดยอาจารย์พิเศษจากอุตสาหกรรมทั้งหมด โดยที่อาจารย์ประจำในหลักสูตรไม่มีใครมีความเชี่ยวชาญหรือมีใบอนุญาตประกอบวิชาชีพในสาขาดังกล่าวเลย และไม่มีแผนการรับอาจารย์ใหม่ที่มีความเชี่ยวชาญตรงสายในระยะ 3 ปีข้างหน้า","a":"D","s":"คณาจารย์ประจำต้องมีความรู้ความสามารถ (Competency) ครอบคลุมเนื้อหาหลักของหลักสูตร การพึ่งพาอาจารย์พิเศษในวิชาแกนหลักทั้งหมดโดยที่อาจารย์ประจำไม่มีความเชี่ยวชาญเลย ถือเป็นการไม่ปฏิบัติตามเกณฑ์ขั้นพื้นฐานในการรักษามาตรฐานทางวิชาชีพของหลักสูตร"},{"q":"จากการสัมภาษณ์คณาจารย์ พบว่าอาจารย์เกือบทั้งหมดเป็นผู้เชี่ยวชาญระดับสูงในเชิงเทคนิค (Technical Expert) แต่เมื่อซักถามเกี่ยวกับวิธีการวัดผลลัพธ์การเรียนรู้ (Assessment methods) อาจารย์ไม่สามารถอธิบายความเชื่อมโยงระหว่าง \"เกณฑ์การให้คะแนน (Rubrics)\" กับ \"ตัวชี้วัดสมรรถนะ (PIs)\" ที่หลักสูตรกำหนดได้ โดยแจ้งว่าทำตามที่ฝ่ายประกันคุณภาพส่งแบบฟอร์มมาให้เท่านั้น","a":"W","s":"คณาจารย์ต้องมีความเข้าใจในระบบ OBE และกระบวนการประเมินผลลัพธ์การศึกษา หากคณาจารย์ซึ่งเป็นผู้ส่งต่อความรู้ไม่เข้าใจกลไกการวัดผล (Lack of understanding of OBE process) จะส่งผลให้ข้อมูลการประเมิน POs ขาดความน่าเชื่อถือและไม่สามารถนำไปพัฒนาบัณฑิตได้จริง"},{"q":"หลักสูตรมีคณาจารย์ที่มีคุณวุฒิและภาระงานเหมาะสม แต่จากการตรวจสอบสถิติการพัฒนาวิชาชีพย้อนหลัง 3 ปี พบว่าอาจารย์ส่วนใหญ่เข้าร่วมประชุมวิชาการเพื่อนำเสนอผลงานวิจัยอย่างต่อเนื่อง แต่ไม่มีหลักฐานการเข้าร่วมอบรมหรือกิจกรรมที่เกี่ยวข้องกับ \"การพัฒนาเทคนิคการจัดการศึกษา\" หรือ \"เทคโนโลยีการสอนสมัยใหม่\" เลย","a":"C","s":"ปัจจุบันอาจารย์ยังสอนได้ตามปกติ (สอดคล้องเกณฑ์) แต่การขาดการพัฒนาด้าน Pedagogical Skills ในโลกที่เทคโนโลยีการศึกษาเปลี่ยนเร็ว ถือเป็นความเสี่ยง (Potential risk) ที่อาจทำให้คุณภาพการจัดการเรียนการสอนด้อยลงในอนาคต จึงจัดเป็น Concern"},{"q":"ในกระบวนการปรับปรุงหลักสูตรครั้งล่าสุด พบว่าการตัดสินใจเปลี่ยนวิชาบังคับเป็นวิชาเลือกและการปรับลดหน่วยกิตวิชา Lab ถูกกำหนดโดยนโยบายจาก \"คณะกรรมการบริหารมหาวิทยาลัย\" โดยที่คณะกรรมการบริหารหลักสูตร (Faculty) ไม่ได้มีส่วนร่วมในการตัดสินใจหรือแสดงความเห็นคัดค้านเชิงวิชาการได้เลย","a":"D","s":"ตามเกณฑ์ TABEE คณาจารย์ต้องมี \"อำนาจและสิทธิ (Sufficient Authority)\" ในการตัดสินใจและชี้นำทิศทางของหลักสูตร การที่อำนาจการบริหารวิชาการถูกรวมศูนย์จนอาจารย์ประจำหลักสูตรไม่สามารถควบคุมคุณภาพทางวิศวกรรมได้ ถือเป็นความบกพร่องที่ร้ายแรงในโครงสร้างการบริหาร"}]},{"t":"เกณฑ์ข้อ 7 สิ่งอำนวยความสะดวก","items":[{"q":"จากการตรวจเยี่ยมห้องปฏิบัติการกำลังงาน (Electrical Power Lab) พบว่ามีเครื่องจักรไฟฟ้าแรงสูงที่ใช้งานจริงในการสอน แต่ระบบสายดิน (Grounding) ของเครื่องจักรมีสภาพชำรุดและไม่มีป้ายเตือนอันตรายที่ชัดเจน นอกจากนี้หลักสูตรไม่มีสมุดบันทึกการตรวจสอบความปลอดภัยประจำปี ท่านในฐานะ PEV จะวินิจฉัยกรณีนี้อย่างไร","a":"D","s":"ความปลอดภัย (Safety) คือ \"The Safety Line\" ของเกณฑ์ข้อ 7 หากพบสภาพที่อาจก่อให้เกิดอันตรายร้ายแรงต่อนิสิตและไม่มีระบบควบคุมจัดการ ถือว่าไม่ปฏิบัติตามเกณฑ์อย่างชัดเจน (Non-compliance) และขัดต่อมาตรฐานวิชาชีพวิศวกรรม"},{"q":"หลักสูตรวิศวกรรมโยธามีซอฟต์แวร์วิเคราะห์โครงสร้างที่ทันสมัยตามมาตรฐานอุตสาหกรรม แต่พบว่าคอมพิวเตอร์ในห้องปฏิบัติการมีสเปกเครื่องต่ำเกินไป (Outdated Hardware) ทำให้ไม่สามารถรันซอฟต์แวร์เวอร์ชันล่าสุดได้ นิสิตต้องนำโน้ตบุ๊กส่วนตัวมาเองเพื่อทำ Project ส่งผลให้การเข้าถึงทรัพยากรของนิสิตที่มีข้อจำกัดทางการเงินไม่เท่าเทียมกัน","a":"W","s":"ทรัพยากรคอมพิวเตอร์ต้องมีความเหมาะสม (Adequate) และเข้าถึงได้ (Accessible) เพื่อสนับสนุนการบรรลุ POs การที่นิสิตต้องแบกรับภาระจัดหาอุปกรณ์เองเนื่องจากสถาบันไม่พร้อม ถือว่าระบบขาดความเข้มแข็งในการสนับสนุนการเรียนรู้ตามเกณฑ์"},{"q":"ในการตรวจเยี่ยมห้องสมุดและศูนย์สารสนเทศ พบว่าหลักสูตรมีการบอกรับสมาชิกฐานข้อมูลวารสารวิชาการระดับสากล (เช่น IEEE Xplore, ScienceDirect) ครบถ้วนตามมาตรฐานวิศวกรรมศาสตร์ แต่จากการสุ่มสัมภาษณ์นิสิตพบว่านิสิตไม่ทราบวิธีการเข้าใช้จากภายนอกมหาวิทยาลัย (VPN) และบรรณารักษ์ผู้เชี่ยวชาญด้านวิศวกรรมเพิ่งลาออกไปโดยยังไม่มีผู้มาแทน","a":"C","s":"แม้จะมีทรัพยากรสารสนเทศ (Resources) ครบถ้วนตามเกณฑ์ แต่การขาดบุคลากรสนับสนุน (Support staff) และปัญหาการเข้าถึงเริ่มแสดงสัญญาณความเสี่ยงที่อาจทำให้ทรัพยากรนั้นไม่ถูกใช้ประโยชน์เพื่อพัฒนาสมรรถนะนิสิตในอนาคต จึงควรให้เป็น Concern"},{"q":"หลักสูตรมีสิ่งอำนวยความสะดวกพื้นฐานครบถ้วน ทั้งห้องเรียน ห้องปฏิบัติการ และห้องทำงานคณาจารย์ แต่ PEV สังเกตว่าในห้องปฏิบัติการรวม (Common Lab) ไม่มีระบบการจัดการขยะจากสารเคมีหรือวัสดุสิ้นเปลืองที่เป็นระบบ แม้จะยังไม่เกิดอุบัติเหตุหรือผลกระทบทางสิ่งแวดล้อมที่ชัดเจนในขณะนั้น แต่หลักสูตรยังไม่มีแผนงานในการปรับปรุงเรื่องนี้","a":"C","s":"กรณีนี้ระบบหลักยังทำงานได้และสอดคล้องกับข้อกำหนด (Compliance) แต่การขาดระบบการจัดการขยะที่สมบูรณ์อาจก่อให้เกิดอันตรายในอนาคต โดยเฉพาะจากขยะสารเคมี จึงควรให้เป็นข้อวิตกกังวล ซึ่งจะเป็นภาระที่หลักสูตรต้องแก้ไขปรับปรุงก่อนก่ารตรวจประเมินรอบถัดไป"},{"q":"จากการตรวจสอบตารางการใช้ห้องเรียนและห้องปฏิบัติการ พบว่าจำนวนนิสิตในบางกลุ่มวิชาบังคับ (Core Courses) มีจำนวนมากกว่าความจุของห้องถึง 25% ทำให้นิสิตบางส่วนต้องนั่งเรียนในสภาพที่แออัดและมีแสงสว่างไม่เพียงพอต่อการจดบันทึก ซึ่งสถานการณ์นี้เกิดขึ้นต่อเนื่องมาแล้ว 2 ภาคการศึกษาโดยไม่มีการแก้ไข","a":"W","s":"เกณฑ์ข้อ 7 ระบุว่าสิ่งอำนวยความสะดวกต้อง \"Conducive to learning\" (เอื้อต่อการเรียนรู้) การจัดนิสิตเกินความจุห้องจนกระทบต่อสุขลักษณะและประสิทธิภาพการเรียนรู้อย่างต่อเนื่อง ถือเป็นความอ่อนแอของระบบบริหารจัดการทรัพยากรที่ต้องได้รับการแก้ไข"}]},{"t":"เกณฑ์ข้อ 8 การสนับสนุนของสถาบันการศึกษา","items":[{"q":"จากการสัมภาษณ์หัวหน้าภาควิชาและคณะกรรมการบริหารหลักสูตร พบว่าอำนาจในการตัดสินใจจัดซื้อครุภัณฑ์และการบริหารงบประมาณทั้งหมดถูกรวมศูนย์ไว้ที่ส่วนกลางของมหาวิทยาลัย โดยหลักสูตรไม่มีงบประมาณดำเนินงาน (Operating Budget) ของตนเอง และไม่สามารถวางแผนการซ่อมบำรุงล่วงหน้าได้ ส่งผลให้อุปกรณ์ในวิชา Lab หลายชิ้นชำรุดและไม่ได้รับการแก้ไขมานานกว่า 1 ปี","a":"W","s":"เกณฑ์ข้อ 8.1 และ 8.2 เน้นว่าสถาบันต้องมีความเป็นผู้นำและการสนับสนุนด้านงบประมาณที่เพียงพอเพื่อให้หลักสูตรบรรลุเป้าหมาย การที่หลักสูตรไม่มีอำนาจจัดการงบประมาณจนส่งผลกระทบต่อคุณภาพอุปกรณ์การเรียนการสอน (Impact on POs) ถือเป็นความอ่อนแอของระบบการสนับสนุน"},{"q":"ในการตรวจเยี่ยมห้องปฏิบัติการหลัก 5 ห้อง พบว่าหลักสูตรมีบุคลากรสายสนับสนุน (Technical Staff) เพียง 1 ท่าน ซึ่งต้องดูแลทั้งงานสารบรรณ งานเตรียม Lab และงานซ่อมบำรุงเครื่องจักรกลขนาดใหญ่ทั้งหมด จากบันทึกการทำงานพบว่าเจ้าหน้าที่ไม่สามารถปฏิบัติงานได้ทันตามตาราง และมีความเสี่ยงสูงต่อความปลอดภัยของนิสิตเนื่องจากการดูแลที่ไม่ทั่วถึง ท่านจะวินิจฉัยอย่างไร","a":"D","s":"เกณฑ์ข้อ 8.3 กำหนดว่าจำนวนบุคลากรสายสนับสนุนต้อง \"เพียงพอ\" (Adequacy) ต่อความต้องการของหลักสูตร การที่มีเจ้าหน้าที่ไม่เพียงพออย่างร้ายแรงจนกระทบต่อความปลอดภัยและคุณภาพการเรียนการสอนอย่างชัดเจน ถือเป็นความบกพร่องที่ไม่เป็นไปตามเกณฑ์ขั้นต่ำอย่างสิ้นเชิง"},{"q":"มหาวิทยาลัยมีนโยบายปรับลดงบประมาณสนับสนุนการไปนำเสนอผลงานวิชาการของอาจารย์ลงร้อยละ 30 เพื่อนำงบไปลงกับโครงสร้างพื้นฐานด้าน IT แม้ปัจจุบันอาจารย์ในหลักสูตรจะยังคงมีผลงานวิจัยและการพัฒนาวิชาชีพที่ได้มาตรฐาน แต่หลักสูตรยังไม่มีแผนรองรับหากอาจารย์รุ่นใหม่ขาดแรงจูงใจในการพัฒนาตนเองในระยะยาว ท่านในฐานะ PEV ควรตัดสินอย่างไร","a":"C","s":"สถานการณ์ปัจจุบันยังไม่ส่งผลกระทบต่อคุณภาพ (Compliance exist) แต่เริ่มมีสัญญาณความเสี่ยง (Potential threat) จากนโยบายที่อาจส่งผลต่อความยั่งยืนของการพัฒนาคณาจารย์ตามเกณฑ์ข้อ 8.4 ในอนาคต จึงจัดเป็นความวิตกกังวลที่ต้องเฝ้าระวัง"},{"q":"สถาบันมีการจัดสรรงบประมาณสนับสนุนหลักสูตรอย่างต่อเนื่องและมีระบบบริหารจัดการที่โปร่งใส อย่างไรก็ตาม PEV สังเกตว่ากระบวนการเบิกจ่ายงบประมาณสำหรับการทำโครงงานนักศึกษา (Capstone Project) มีขั้นตอนที่ซับซ้อนและต้องใช้ระยะเวลานานกว่า 4 สัปดาห์ แม้นิสิตจะแจ้งว่ายังสามารถบริหารจัดการได้แต่เห็นว่าหากปรับปรุงจะช่วยให้การทำงานคล่องตัวขึ้น","a":"R","s":"ระบบการสนับสนุนในภาพรวมมีความเข้มแข็งและสอดคล้องกับเกณฑ์ (Criteria met) ประเด็นเรื่องความล่าช้าในขั้นตอนการเบิกจ่ายเป็นเพียงข้อจำกัดเชิงเทคนิคที่ควรให้คำแนะนำเพื่อการพัฒนา (Advice for improvement) เพื่อเพิ่มประสิทธิภาพการจัดการ"},{"q":"จากการตรวจสอบความมั่นคงทางการเงิน (Financial Stability) พบว่าหลักสูตรวิศวกรรมศาสตร์นี้พึ่งพารายได้จากค่าเทอมนิสิตเพียงอย่างเดียว โดยที่จำนวนนิสิตรับจริงลดลงต่อเนื่องร้อยละ 20 ในรอบ 3 ปีที่ผ่านมา และสถาบันยังไม่มีแผนงานในการระดมทุนหรือการจัดสรรงบประมาณกลางมาชดเชยส่วนต่างที่หายไป เพื่อรักษาคุณภาพของห้องปฏิบัติการและการจ้างงานคณาจารย์","a":"W","s":"เกณฑ์ข้อ 8.2 ระบุว่าสถาบันต้องแสดงความมั่นใจได้ว่าทรัพยากรทางการเงินเพียงพอที่จะรองรับความต่อเนื่องของหลักสูตร การขาดความมั่นคงและไม่มีแผนรองรับภาวะวิกฤตทางการเงินถือเป็นข้อด้อยที่ส่งผลต่อคุณภาพและความยั่งยืนของหลักสูตรในระยะยาว"}]}];

/* ---------- transport: MQTT/WSS with failover + BroadcastChannel (same browser) ---------- */
function Net(room,topics,onmsg,onstat){
  const base=PREFIX+'/'+room;let c=null,bc=null,stat='wait';
  const set=s=>{stat=s;onstat&&onstat(s)};
  try{bc=new BroadcastChannel(base);bc.onmessage=e=>onmsg(e.data.t,e.data.o)}catch(e){}
  function dial(i){
    if(!window.mqtt){set('nolib');setTimeout(()=>dial(0),6000);return}
    if(i>=BROKERS.length){set('fail');setTimeout(()=>dial(0),9000);return}
    let ok=false;
    try{
      const k=mqtt.connect(BROKERS[i],{clientId:'w'+rid(6)+Date.now().toString(36),connectTimeout:6000,reconnectPeriod:0,keepalive:30,clean:true});
      const to=setTimeout(()=>{if(!ok){try{k.end(true)}catch(e){}dial(i+1)}},7000);
      k.on('connect',()=>{ok=true;clearTimeout(to);c=k;k.subscribe(topics.map(t=>base+'/'+t),{qos:0});set('ok')});
      k.on('message',(tp,pl)=>{try{onmsg(tp.slice(base.length+1),JSON.parse(pl.toString()))}catch(e){}});
      k.on('close',()=>{if(ok){ok=false;c=null;set('wait');setTimeout(()=>dial(0),1500)}});
      k.on('error',()=>{});
    }catch(e){dial(i+1)}
  }
  setTimeout(()=>dial(0),300);
  return {pub(t,o,retain){try{bc&&bc.postMessage({t,o})}catch(e){}try{c&&c.publish(base+'/'+t,JSON.stringify(o),{qos:0,retain:!!retain})}catch(e){}},stat:()=>stat};
}
const STAT={ok:'เชื่อมต่อแล้ว',wait:'กำลังเชื่อมต่อ…',fail:'เชื่อมต่อไม่ได้ กำลังลองใหม่',nolib:'โหลดตัวเชื่อมต่อไม่ได้'};

/* =================== VOTER (phone) =================== */
function voter(){
  const me=ls.get('ws-me',null)||{id:rid(10),name:''};let st={q:0,ph:'idle',end:0},my=ls.get('ws-my-'+JOIN,{}),net,tick;
  const save=()=>{ls.set('ws-me',me);ls.set('ws-my-'+JOIN,my)};
  function draw(){
    clearInterval(tick);const a=$('#app');
    let h=`<header><h1>${esc(SETNAME)}</h1><span class="sp"></span><span class="st ${net&&net.stat()}" id="st">${STAT[net?net.stat():'wait']}</span></header><div class="v">`;
    if(!me.name){h+=`<div class="card"><h2>เข้าร่วม Workshop</h2><p class="note">ห้อง <b>${JOIN}</b> · พิมพ์ชื่อที่จะแสดงบนจอวิทยากร</p><input id="nm" maxlength="24" placeholder="ชื่อ หรือ ชื่อกลุ่ม" autocomplete="off"><div class="row"><button class="big" id="go">เข้าร่วม</button></div></div></div>`;a.innerHTML=h;
      $('#go').onclick=()=>{const v=$('#nm').value.trim();if(!v)return;me.name=v.slice(0,24);save();hello();draw()};return}
    const c=CASES[st.q],k=my[st.q];
    h+=`<p class="note">${esc(me.name)} · ห้อง ${JOIN} <a href="#" id="ren">เปลี่ยนชื่อ</a></p>`;
    if(st.ph==='idle'){h+=`<div class="card vmsg"><h2>ข้อ ${st.q+1} / ${CASES.length}</h2>รอวิทยากรกด Start<br>อ่านสถานการณ์บนจอหน้าห้อง</div>`}
    else{
      h+=`<div class="card"><span class="tag">ข้อ ${st.q+1} · ${esc(c.c)}</span><h2 style="font-size:20px">${esc(c.t)}</h2>${IMGS[st.q]?`<img src="${IMGS[st.q]}" alt="" style="width:100%;border-radius:10px;margin:2px 0 8px;aspect-ratio:16/9;object-fit:cover">`:''}`;
      if(st.ph==='open')h+=`<div class="vt" id="vt"></div>`;
      h+=`<details ${st.ph==='open'?'':'open'}><summary class="note">อ่านสถานการณ์</summary><p style="font-size:15px">${esc(c.q)}</p></details>`;
      h+=KS.map(x=>`<button class="vopt ${k===x?'sel':''}" data-k="${x}" ${st.ph==='open'?'':'disabled'} style="border-color:var(--${x});background:${k===x?`var(--${x})`:`var(--${x}t)`};${k===x&&x==='R'?'color:#3a2c00':''}"><span class="dot" style="background:${k===x?'#fff':`var(--${x})`}"></span>${LV[x]}</button>`).join('');
      if(st.ph==='open')h+=`<p class="note" style="text-align:center">${k?'ส่งคำตอบแล้ว เปลี่ยนได้จนกว่าจะหมดเวลา':'เลือกระดับข้อค้นพบ 1 ข้อ'}</p>`;
      if(st.ph==='closed')h+=`<p class="note" style="text-align:center">หมดเวลาแล้ว ${k?'คำตอบของคุณคือ <b>'+LV[k]+'</b>':'คุณไม่ได้ส่งคำตอบ'} · รอเฉลยบนจอ</p>`;
      if(st.ph==='reveal')h+=`<div class="sol" style="border-color:var(--${c.a});background:var(--${c.a}t)"><b>${k===c.a?'✓ ตรงกับเฉลย':'เฉลย'}</b> <b class="k" style="background:var(--${c.a});${c.a==='R'?'color:#3a2c00':''}">${LV[c.a]}</b><br>${esc(c.s)}</div>`;
      h+=`</div>`}
    h+=`</div>`;a.innerHTML=h;
    $('#ren').onclick=e=>{e.preventDefault();me.name='';draw()};
    document.querySelectorAll('.vopt').forEach(b=>b.onclick=()=>{if(st.ph!=='open')return;my[st.q]=b.dataset.k;save();send();draw()});
    if(st.ph==='open'){const f=()=>{const e=$('#vt');if(e)e.textContent=mmss((st.end-Date.now())/1000)};f();tick=setInterval(f,250)}
  }
  const send=()=>net.pub('vote',{id:me.id,name:me.name,q:st.q,k:my[st.q]});
  const hello=()=>me.name&&net.pub('hello',{id:me.id,name:me.name});
  net=Net(JOIN,['state'],(t,o)=>{if(t!=='state')return;
      if(o.rs&&o.rs!==ls.get('ws-rs-'+JOIN,''))  {my={};ls.set('ws-rs-'+JOIN,o.rs);save()}
      if(o.clear!=null){delete my[o.clear];save()}
      st={q:o.q,ph:o.ph,end:Date.now()+(o.left||0)*1000};draw();
      if(o.ph==='open'&&my[o.q])send()},
    s=>{const e=$('#st');if(e){e.textContent=STAT[s];e.className='st '+s}if(s==='ok'){hello();net.pub('ask',{})}});
  draw();
}

/* =================== PRESENTER =================== */
function presenter(){
  let S=ls.get('ws-host-'+SETK,null)||{room:rid(4),rs:rid(5),q:0,dur:180,ph:{},votes:{},people:{}};
  let end=0,tick,net,showNames=true;
  const save=()=>ls.set('ws-host-'+SETK,S),ph=()=>S.ph[S.q]||'idle',V=()=>S.votes[S.q]||(S.votes[S.q]={});
  const joinURL=()=>location.origin+location.pathname+'?join='+S.room;
  const hosted=/^https?:/.test(location.protocol);
  function push(extra){net.pub('state',Object.assign({q:S.q,ph:ph(),left:ph()==='open'?Math.max(0,(end-Date.now())/1000):0,rs:S.rs},extra||{}),true)}
  function qrsvg(){try{const q=qrcode(0,'M');q.addData(joinURL());q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return ''}}
  function start(){S.ph[S.q]='open';end=Date.now()+S.dur*1000;save();push();draw()}
  function stop(){if(ph()!=='open')return;S.ph[S.q]='closed';end=0;save();push();draw()}
  function draw(){
    clearInterval(tick);const c=CASES[S.q],p=ph(),v=V(),n=Object.keys(v).length,np=Object.keys(S.people).length;
    let h=`<header><h1>Quiz &amp; Poll · ${esc(SETNAME)}</h1><select id="bSet" class="hb g" aria-label="เลือกชุดคำถาม">${SETOPT.map(o=>`<option value="${o[0]}" ${o[0]===SETK?'selected':''}>${o[1]}</option>`).join('')}</select><span class="sp"></span><span class="st ${net?net.stat():'wait'}" id="st">${STAT[net?net.stat():'wait']}</span>
      <button class="hb g" id="bBoard">ตารางคะแนน</button><button class="hb g" id="bExp">ส่งออกผล</button><button class="hb g" id="bFull">เต็มจอ</button><button class="hb" id="bNew">เริ่มรอบใหม่</button></header><main>
      <div class="qnav">${CASES.map((x,i)=>`<button data-q="${i}" class="${i===S.q?'on':''} ${S.ph[i]==='reveal'?'done':''}">${i+1}</button>`).join('')}</div><div class="grid"><div class="card">
      <figure class="img" id="fig"><img src="${IMGS[S.q]||''}" alt="ภาพประกอบสถานการณ์ข้อ ${S.q+1}" ${IMGS[S.q]?'':'hidden'}><figcaption>AI-generated illustration (Gemini)</figcaption></figure>
      <span class="tag">ข้อ ${S.q+1} / ${CASES.length} · ${esc(c.c)}</span><h2>${esc(c.t)}</h2><div class="scn">${esc(c.q)}</div><div class="ask">ในฐานะ PEV ท่านจะให้ข้อค้นพบระดับใด</div>
      <div class="chs">${KS.map(k=>`<button class="ch ${p==='reveal'&&k===c.a?'key':''}" data-ch="${k}" ${p==='open'?'':'disabled'} style="--c:var(--${k});--t:var(--${k}t)"><span class="dot"></span>${LV[k]}${p==='reveal'&&k===c.a?' ✓':''}</button>`).join('')}</div>
      <div class="note" id="chn">${p==='open'?'ผู้ที่ไม่มีมือถือ: วิทยากรแตะตัวเลือกบนจอแทนได้ (นับเป็น “หน้าห้อง”) · แตะแล้ว <b id="mn">'+Object.keys(v).filter(i=>i[0]==='_').length+'</b> ครั้ง':''}</div>`;
    // results
    h+=`<div class="res">`;
    if(p==='idle')h+=`<div class="hid">ยังไม่เริ่ม · ตั้งเวลาแล้วกด Start</div>`;
    else if(p==='open')h+=`<div class="hid">กำลังรับคำตอบ · คำตอบจะแสดงเมื่อหมดเวลา</div>`;
    else{const tot=n||1;
      h+=KS.map(k=>{const who=Object.values(v).filter(x=>x.k===k),key=p==='reveal'&&k===c.a;
        return `<div class="bar ${key?'key':''}"><div class="l"><span class="dot" style="background:var(--${k})"></span>${LV[k]}${key?' ✓':''}</div><div class="tr"><div class="f" data-w="${who.length/tot*100}" style="background:var(--${k})"></div></div><div class="n">${who.length} <span class="note">(${Math.round(who.length/tot*100)}%)</span></div>${showNames&&who.length?`<div class="names">${who.map(x=>`<span style="border-color:var(--${k});background:var(--${k}t)">${esc(x.name)}</span>`).join('')}</div>`:''}</div>`}).join('');
      if(!n)h+=`<p class="note">ไม่มีผู้ส่งคำตอบในข้อนี้</p>`;
      if(p==='reveal')h+=`<div class="sol" style="border-color:var(--${c.a});background:var(--${c.a}t)"><b>เฉลย</b> <b class="k" style="background:var(--${c.a});${c.a==='R'?'color:#3a2c00':''}">${LV[c.a]}</b> ตอบตรงเฉลย ${Object.values(v).filter(x=>x.k===c.a).length} จาก ${n} คน<br>${esc(c.s)}</div>`}
    h+=`</div></div><div class="side"><div class="card"><div class="join"><div class="qr">${qrsvg()}</div><div><div class="note">สแกนเพื่อร่วมตอบ · ห้อง</div><div class="room">${S.room}</div><div class="url">${esc(joinURL())}</div><div class="note">เข้าร่วมแล้ว <b>${np}</b> คน</div></div></div>
      ${hosted?'':'<div class="warn" style="margin-top:10px">หน้านี้เปิดจากไฟล์ในเครื่อง มือถือจะสแกน QR เข้าร่วมไม่ได้ ให้เปิดจากลิงก์บนเว็บ (GitHub Pages)</div>'}</div>
      <div class="card"><div class="timer ${p==='open'?'run':''}" id="tm">${mmss(p==='open'?(end-Date.now())/1000:S.dur)}</div>
      <div class="row">${DURS.map(d=>`<button class="pill ${S.dur===d?'on':''}" data-d="${d}" ${p==='open'?'disabled':''}>${dlab(d)}</button>`).join('')}</div>
      <div class="row" style="align-items:center;gap:6px"><span class="note">กำหนดเอง</span><input id="dCus" type="number" min="0.5" max="30" step="0.5" value="${S.dur/60}" style="width:74px;padding:6px 8px;border:1.5px solid #ccc;border-radius:8px;font:inherit" ${p==='open'?'disabled':''}><span class="note">นาที</span><button class="pill" id="dSet" ${p==='open'?'disabled':''}>ตั้งเวลา</button></div>
      <div class="row">${p==='open'?`<button class="big stop" id="bStop">■ Stop</button>`:`<button class="big" id="bStart" ${p==='idle'?'':'disabled'}>▶ Start</button>`}
        <button class="big rev" id="bRev" ${p==='closed'?'':'disabled'}>เฉลย</button></div>
      <div class="cnt">ได้รับแล้ว <b id="cn">${n}</b> คำตอบ<br><span class="note">มือถือเข้าร่วม ${np} คน</span></div>
      <div class="row"><button class="pill" id="bPrev" ${S.q?'':'disabled'}>← ข้อก่อนหน้า</button><button class="pill" id="bNext" ${S.q<CASES.length-1?'':'disabled'}>ข้อถัดไป →</button></div>
      <div class="row"><button class="pill" id="bNames" ${p==='closed'||p==='reveal'?'':'disabled'}>${showNames?'ซ่อนชื่อ':'แสดงชื่อ'}</button><button class="pill" id="bRe" ${p==='idle'||p==='open'?'disabled':''}>ทำข้อนี้ใหม่</button></div></div></div></div></main>
      <div class="ovl" id="ovl"><div class="box" id="box"></div></div>`;
    $('#app').innerHTML=h;
    requestAnimationFrame(()=>document.querySelectorAll('.f').forEach(f=>f.style.width=f.dataset.w+'%'));
    document.querySelectorAll('.qnav button').forEach(b=>b.onclick=()=>go(+b.dataset.q));
    document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{if(ph()!=='open')return;const m=Object.keys(V()).filter(i=>i[0]==='_').length+1;V()['_'+m+rid(3)]={k:b.dataset.ch,name:'หน้าห้อง '+m};save();$('#cn').textContent=Object.keys(V()).length;$('#mn').textContent=m});
    document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.dur=+b.dataset.d;save();draw()});
    const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
    on('#bStart',start);on('#dSet',()=>{const v=parseFloat($('#dCus').value);if(v>0&&v<=30){S.dur=Math.round(v*60);save();draw()}});{const e=$('#bSet');if(e)e.onchange=()=>{location.href='../assesstrain'+(e.value==='mix'?'':e.value.slice(1))+'/'}}on('#bStop',stop);on('#bRev',()=>{S.ph[S.q]='reveal';save();push();draw()});
    on('#bPrev',()=>go(S.q-1));on('#bNext',()=>go(S.q+1));on('#bNames',()=>{showNames=!showNames;draw()});
    on('#bRe',()=>{S.ph[S.q]='idle';S.votes[S.q]={};save();push({clear:S.q});draw()});
    on('#bFull',()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}});
    on('#bBoard',board);on('#bExp',exp);on('#bNew',()=>modal(`<h2>เริ่มรอบใหม่</h2><p>ล้างคำตอบทั้งหมด รายชื่อผู้เข้าร่วม และสร้างรหัสห้องใหม่ (QR จะเปลี่ยน)</p><div class="row"><button class="big stop" id="yes">ล้างและเริ่มใหม่</button><button class="big sec" id="no">ยกเลิก</button></div>`,()=>{$('#yes').onclick=()=>{ls.set('ws-host-'+SETK,null);location.reload()};$('#no').onclick=close}));
    if(p==='open'){const f=()=>{const l=(end-Date.now())/1000,e=$('#tm');if(e){e.textContent=mmss(l);e.classList.toggle('low',l<=10)}if(l<=0)stop()};tick=setInterval(f,200)}
  }
  function go(i){if(i<0||i>=CASES.length)return;if(ph()==='open')stop();S.q=i;save();push();draw()}
  function modal(html,after){$('#box').innerHTML=html;$('#ovl').classList.add('on');$('#ovl').onclick=e=>{if(e.target.id==='ovl')close()};after&&after()}
  function close(){$('#ovl').classList.remove('on')}
  function score(){return Object.entries(S.people).map(([id,name])=>{let s=0,a=0;const row=CASES.map((c,i)=>{const x=(S.votes[i]||{})[id];if(x&&S.ph[i]==='reveal'){a++;if(x.k===c.a)s++}return x?x.k:''});return {id,name,s,a,row}}).sort((x,y)=>y.s-x.s||x.name.localeCompare(y.name))}
  function board(){const r=score();modal(`<h2>ตารางคะแนน</h2><p class="note">นับเฉพาะข้อที่เฉลยแล้ว · ช่องสีคือระดับที่ตอบ ขอบดำคือตรงเฉลย</p><table class="board"><tr><th>#</th><th>ชื่อ</th>${CASES.map((c,i)=>`<th class="c">${i+1}</th>`).join('')}<th>ถูก</th></tr>${r.map((p,j)=>`<tr><td>${j+1}</td><td>${esc(p.name)}</td>${p.row.map((k,i)=>`<td class="c">${k&&S.ph[i]==='reveal'?`<span class="cell" style="background:var(--${k});${k===CASES[i].a?'outline:2.5px solid #000':''}">${k}</span>`:k?'•':''}</td>`).join('')}<td><b>${p.s}</b>/${p.a}</td></tr>`).join('')||'<tr><td colspan="13">ยังไม่มีผู้เข้าร่วม</td></tr>'}</table><div class="row"><button class="big sec" id="no">ปิด</button></div>`,()=>$('#no').onclick=close)}
  function exp(){const r=score();const csv=['name,'+CASES.map((c,i)=>'Q'+(i+1)).join(',')+',correct,answered'].concat(r.map(p=>'"'+p.name.replace(/"/g,'""')+'",'+p.row.join(',')+','+p.s+','+p.a)).concat(['KEY,'+CASES.map(c=>c.a).join(',')+',,']).join('\n');
    modal(`<h2>ส่งออกผล (CSV)</h2><p class="note">กด Copy แล้ววางใน Excel หรือ Google Sheets · N=ไม่มีประเด็น R=Remark C=Concern W=Weakness D=Deficiency</p><textarea id="csv" readonly></textarea><div class="row"><button class="big" id="cp">Copy</button><button class="big sec" id="no">ปิด</button></div>`,()=>{$('#csv').value=csv;$('#no').onclick=close;$('#cp').onclick=()=>{const t=$('#csv');t.select();try{navigator.clipboard.writeText(csv).catch(()=>document.execCommand('copy'))}catch(e){try{document.execCommand('copy')}catch(_){}}$('#cp').textContent='Copied ✓'}})}
  net=Net(S.room,['vote','hello','ask'],(t,o)=>{
      if(t==='ask'){push();return}
      if(!o||!o.id)return;const name=String(o.name||'').slice(0,24)||'ไม่ระบุชื่อ';
      const isNew=!S.people[o.id]||S.people[o.id]!==name;S.people[o.id]=name;
      if(t==='vote'&&o.q===S.q&&ph()==='open'&&KS.includes(o.k)){V()[o.id]={k:o.k,name};save();const e=$('#cn');if(e)e.textContent=Object.keys(V()).length;if(isNew)draw();return}
      if(isNew){save();draw()}},
    s=>{const e=$('#st');if(e){e.textContent=STAT[s];e.className='st '+s}if(s==='ok')push()});
  if(ph()==='open'){S.ph[S.q]='closed';save()}
  draw();
  document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(S.q+1);if(e.key==='ArrowLeft')go(S.q-1)});
}
JOIN?voter():presenter();
</script></body></html>
